# 의존성 취약점 — **판정된 것만** 여기 있다 (`NFR-405-AC1` · R42)
#
# `pip-audit` 가 찾은 권고 ID 중 **이 목록에 있는 것만** CI 를 통과한다.
# 없는 것이 하나라도 나오면 CI 가 빨간불이며, 통과시키려면 **여기에 판정을
# 적어야 한다** — 「올린다」든 「올리지 않는다」든 사람이 한 번은 보게 된다.
#
# ## 왜 목록으로 두는가
#
# 종전에는 발견을 `::warning::` 으로만 냈다. 조항이 Should-have 라 차단하지
# 않는 것은 옳지만, 그 결과 **취약점이 초록불 안에 숨어** 새로 하나 더 생겨도
# 아무 일도 일어나지 않았다 — 이 저장소가 경계하는 「빨간불이 아닌 방식으로
# 죽는 것」이다. 목록으로 두면 **판정된 것은 조용하고 판정 안 된 것만 말한다.**
#
# ## 왜 차단이 「통과할 수 없는 검사」가 되지 않는가
#
# 워크플로 주석이 경고한 대로, 상류가 안 고친 취약점 하나로 CI 가 영구히
# 빨간불이 되면 그 검사는 꺼진다. 여기에는 **빠져나갈 문이 있다** — 사유를
# 적고 목록에 넣으면 통과한다. `KNOWN_TARIFF_DEBT` 와 같은 래칫이며, 막는
# 것은 취약점이 아니라 **아무도 안 본 취약점**이다.
#
# ## 적는 법
#
# `id` 는 `pip-audit` 출력에 나오는 그대로(`PYSEC-…` · `GHSA-…` · `CVE-…`).
# `decision` 은 `올리지 않는다` / `올린다(예정)` 둘 중 하나이고, 어느 쪽이든
# `reason` 과 `revisit_when` 이 있어야 한다 — 「무엇이 오면 바뀌나」가 없는
# 판정은 영구 판정이 된다(`assumptions.yaml` 의 `replace_when` 과 같은 이유).

accepted:
  - id: PYSEC-2026-3447
    package: setuptools
    installed: "79.0.1"
    fixed_in: "83.0.0"
    decision: 올리지 않는다
    judged_at: "2026-08-29"
    judged_in: R42
    reason: >-
      `setuptools` 는 이 저장소의 **런타임 의존이 아니다** — `pyproject.toml`
      의 `[build-system] requires` 에만 있고 `uv.lock` 에도 없다. 즉 배포물이
      실행하는 코드가 아니라 **빌드·설치 환경의 패키지**이며, CI 러너가
      `pip install -e` 를 도는 동안에만 존재한다. 위험의 소재가 우리가 배포하는
      것 안에 없으므로, 상류 판본을 따라 올리는 일보다 **그 사실을 적어 두는
      것**이 정확한 조치다.
      ★ 「올린다」를 고르지 않은 이유는 작아서가 아니다 — `requires` 를 올리면
      빌드 백엔드가 바뀌고 빌드·설치 경로를 다시 재야 하는데, 그 재검증이
      막는 위험이 **여기서는 0**이다(런타임에 없다). 근거 없는 이동은 하지
      않는다.
    revisit_when: >-
      ⓐ `setuptools` 가 런타임 의존으로 들어오는 날(`uv.lock` 에 나타나거나
      `import setuptools`·`pkg_resources` 가 `core/`·`app/`·`infra/` 에 생기는
      날) ⓑ 같은 패키지에 **빌드 산출물을 오염시키는** 유형의 권고가 나오는 날
      ⓒ 다른 이유로 빌드 백엔드를 손대는 날 — 그때 함께 올린다.

  # ⚠ **「2건」은 서로 다른 권고 둘이 아니다** — R42 가 CI 로그(run 33247110443)를
  # 직접 열어 확인했다. `pip-audit` 가 *"Found 2 known vulnerabilities in 1
  # package"* 라 세면서 표에는 **같은 줄을 두 번** 찍는다:
  #
  #     setuptools 79.0.1  PYSEC-2026-3447  83.0.0
  #     setuptools 79.0.1  PYSEC-2026-3447  83.0.0
  #
  # 그래서 **건수와 ID 수가 다르다.** 검사기가 건수를 세지 않고 **ID 를
  # 대조하는** 이유가 이것이다 — 「2」를 기대값으로 적었다면 그 수는 무엇도
  # 가리키지 못한 채 맞았을 것이다.
