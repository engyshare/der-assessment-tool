# manual-checks.yaml — 자동화할 수 없는 수용기준의 대장
#
# spec NFR-107이 요구하는 "모든 Must-have 수용기준의 검증 항목 매핑" 중,
# pytest로 내려올 수 없는 것을 여기에 등재한다.
#
# 왜 이 파일이 필요한가
#   "100% pytest 매핑"을 예외 없이 강제하면 두 가지 중 하나가 일어난다.
#     ① CI가 영구히 빨간불이거나
#     ② 통과시키려고 아무것도 검증하지 않는 가짜 테스트를 짓는다
#   ②는 spec §13.0.2가 금지한 자기충족 테스트를 규칙이 강제하는 꼴이다.
#   수동 검증은 누락이 아니라 **다른 종류의 검증**이므로, 빠뜨리는 대신 등재한다.
#
# 등재 기준 — 다음 중 하나에 해당할 때만 여기 올린다
#   · 사람의 이해·판단이 측정 대상이다 (설명 재현, 사용성)
#   · 시각적 판정이 필요하다 (배지 색, 레이아웃)
#   · 판정자가 도메인 경험자여야 한다 (심의 경험)
#   "테스트 짜기 어렵다"는 등재 사유가 아니다. 그것은 자동 검증 대상이다.
#
# 상태 값
#   미수행    한 번도 수행하지 않음
#   수행      수행하고 결과를 기록함
#   재수행필요 관련 구현이 바뀌어 이전 결과가 무효가 됨
#
# 판정 값
#   통과 / 미달 / 부분    (미수행 상태에서는 비워 둔다)
#
# blocking_dod (필수 칸 — WP-24C)
#   true  / false
#   미수행 상태에서 Phase 완료(DoD) 판정을 막아야 하면 true. 이 칸이 없으면
#   scripts/gen_traceability.py 가 종료 코드 2로 멈춘다 — 값을 빠뜨리면 다음
#   사람이 깃발을 지우거나 false로 바꿔도 아무 일도 일어나지 않기 때문이다.
#   true이고 status가 `수행`이 아니면 docs/traceability.md와 stdout에
#   「판정불가」로 표기된다. CI 게이트 자체는 초록불을 유지한다 — 실패시키면
#   사람이 수행할 때까지 CI가 영구히 빨간불이 되어 위 "왜 이 파일이 필요한가"의
#   ①·② 딜레마가 그대로 재현된다.
#
# planned_at / planned_owner (미수행 항목의 예정 칸)
#   미수행 항목이 「언제·누가」 수행할지 적는 자리다. 값이 없으면 null로 둔다 —
#   칸이 아예 없는 것과 값이 비어 있는 것을 구별하기 위해 모든 항목에 칸 자체는
#   둔다. 값은 오케스트레이터가 사용자와 정한다.
#
# 기록 규칙
#   · 수행 일자(performed_at)·수행자(performed_by)·표본(sample)·결과(result_note)를
#     반드시 남긴다. 기록 없는 항목은 미수행으로 본다 (NFR-107-AC3)
#   · `재수행필요`는 사람이 표시한다. 자동 판정하지 않는다 — 어떤 변경이 결과를
#     무효화하는지는 기계가 알 수 없다
#   · Phase DoD 판정 시 이 파일의 `미수행` 건수와 `blocking_dod` 를 함께 확인한다.
#     `blocking_dod: true` 이고 미수행이면 그 DoD 항목은 「충족」이 아니라
#     「판정불가」다
#
# 이 파일은 scripts/gen_traceability.py 의 입력이다.
# docs/traceability.md 에 자동 반영되므로 그쪽을 직접 고치지 않는다.

version: 1
updated: "2026-08-02"

checks:
  - id: "MC-1"
    requirement: "FR-1001"
    criterion_id: "FR-1001-AC5"
    criterion: "(마) 판정 기준 — 비개발자 검토자가 리포트만 보고 회수기간의 근거와 결론 전환 조건을 설명할 수 있다"
    why_manual: "측정 대상이 사람의 이해다. 리포트 출력물의 형식이 아니라 그것을 읽은 사람이 인과를 재구성할 수 있는지를 본다"
    method: "심의 경험자 3명 대상 설명 재현 테스트"
    pass_criterion: "3명 중 3명이 주요 인자와 결론의 인과를 설명 (§14 KPI)"
    phase: 1
    blocking_dod: true          # Phase 1 DoD 5 — SG-3
    status: "미수행"
    verdict: null
    performed_at: null
    performed_by: null
    sample: null
    result_note: null
    evidence: null
    # ★ **잠정 계획이다 (R32, 2026-08-14).** 결정이 아니라 「언제·누가」 한 줄
    # 기입이며, 그것 하나가 Phase 1 인수를 「판정불가」로 잡고 있었다. 사용자가
    # 실제 담당자·가능 일자를 정하면 이 두 칸을 교체한다 —
    # 근거는 `docs/decisions-2026-08-14-R32.md` §5.
    #
    # 4주를 둔 이유: 이 검사는 「심의 경험자 3명 대상 설명 재현 테스트」라
    # **사람 섭외가 선행**이고, 리포트 산출물(FR-1001)이 R31~R32 에 계속 바뀌었으므로
    # **바뀐 리포트로** 해야 한다.
    #
    # ⚠ `status` 는 **「미수행」 그대로 둔다.** 일정 기입은 「언제 볼 것인가」이고
    # 수행은 「보았다」다 — 수행하지 않은 검사를 「수행」으로 적으면 그 순간 이
    # 저장소의 판정 체계가 무의미해진다. 일정만 채워도 DoD 는 여전히 「판정불가」이며
    # 그것이 사실이다.
    planned_at: "2026-09-11"
    planned_owner: "평가 프로그램 담당 (심의 경험자 3명 섭외 포함)"

