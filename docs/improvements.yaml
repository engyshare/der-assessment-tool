# 개선 방안 대장 — 「무엇을 바꾸면 얼마나 좋아지는가」 (R71/WP-7)
#
# ★★★ 이 파일은 «지금 이 사업이 쓰는 값»이 아니라 «바꾸면»이다.
#     `assumptions.yaml` 과 섞지 마라.
#
# 저쪽(`docs/assumptions.yaml`)은 지금 사업이 실제로 쓰는 값의 대장이고 이 파일은
# 「그 값·구성을 이렇게 바꾸면」의 목록이다. 둘을 한 파일에 쓰면 기준선이 사라지고
# 골든 3종(`fixtures/golden/scenario_*.yaml`)이 개선안마다 함께 움직인다 — 그러면
# 「얼마나 좋아졌는가」를 견줄 상대가 없어진다. 그래서 방안은 **시나리오 오버레이**로만
# 표현하며(오케 판정 `.orch/R71/WP-7.md` §2①), 이 파일은 그 오버레이의 목록이다.
#
# ⚠ 문면 한 가지 — 위 ★★★ 은 오케 지시문 §2② 가 요구한 문장과 같은 뜻이되 그것이
#   쓴 낱말 하나를 바꿔 적었다. 사람이 읽는 자리에서 그 낱말(대장을 가리키는 옛말)을
#   0건으로 두는 것이 이 저장소의 규약이기 때문이다(판정 R63b §1). 대장을 부르는 말은
#   「분석 설정 대장」이다.
#
# ── 읽는 것은 `scripts/improvement_effects.py` 하나다 ─────────────────────────
#
#     PYTHONUTF8=1 ./.venv/Scripts/python.exe -m scripts.improvement_effects
#
# 그 도구가 방안마다 「기준 + 그 방안 하나」를 돌려 Δ 를 재고 다섯 절로 인쇄한다.
# **한 번에 하나씩** 적용하며 조합은 재지 않는다 — 사용자 문면이 *「각각 제시」* 다.
#
# ── 한 항목의 칸 ─────────────────────────────────────────────────────────────
#
#   id            방안을 부르는 이름. 두 목록에 걸쳐 중복되면 도구가 거부한다
#   title         사람이 읽는 한 줄
#   lever         제도 | 구성 | 단가   (셋 중 하나)
#   precondition  ⓐ배선 | ⓑ구성 | ⓒ제도·사업판단  (`.orch/R71/result_5.md` 의 3분류)
#   rationale     왜 이것이 방안인가 — 한두 문장
#   source        ★★ 이 값의 근거. **비워 둘 수 없다.** 근거가 없으면
#                 「근거 없음 — 크기만 보는 가정」 이라고 적으며, 그때 도구는 그
#                 표시를 산출물에 그대로 인쇄한다. 이 저장소는 *「없는 시장의 수익이
#                 결론의 부호를 만든다」* 를 반복해 경계해 왔다
#   feasibility   ★★★ **제도가 이것을 허용하는가** — `확인` | `조건부` | `불가` |
#                 `미확인` 넷만 받는다(그 밖은 도구가 3요소로 거부한다)
#   feasibility_source
#                 ★★★ 왜 그렇게 판정했나 + **근거의 등급**(원문 확인 / 간접자료 /
#                 미확인). 비워 둘 수 없다
#   apply         얹는 오버레이. 받는 키는 넷뿐이다 —
#                 `assumption_overrides`(항목마다 `reason` 필수) ·
#                 `operation_options` · `design_capacity` · `subsidy_rate`
#                 ⛔ `design_capacity.ess_power_kw` 는 실행이 거부한다(아직 배선 없음)
#
# ⚠ `apply` 에 `pv_allocation_priority: 배터리 우선` 이 함께 적힌 방안들이 있다.
#   그것은 조합이 아니라 **그 방안의 성립 조건**이다 — 역송이 0kWh 인 기본 배분
#   (집 우선)에서는 잉여판매·REC 단가가 0kWh 에 곱해져 단가를 아무리 올려도 Δ=0 이다
#   (`.orch/R71/result_5.md` §4 결정시험 B·D). 도구는 그 방안 행에
#   「배분 변경을 포함한다」를 인쇄한다.
#
# ── ⚠⚠ `source` 와 `feasibility` 는 «다른 축»이다 — 섞지 마라 ─────────────────
#
#   source        「이 값(150원/kWh)이 어디서 왔나」
#   feasibility   「이 사업이 그것을 실제로 «할 수» 있나」
#
# 조사(`.orch/R71/result_9.md`)가 둘을 따로 판정했다 — 그 §1 표에 「값이 현실적인가」와
# 「적용 가능?」이 따로 있다. 그래서 이 대장도 둘을 따로 든다. **크기 순은 실행 순이
# 아니다** — Δ 가 둘째로 큰 `cp_registration` 이 `불가` 인 것이 그 증거이며, 도구는 그
# 크기를 지우지 않고 **뒤 묶음**에 세운다(「이만큼 크지만 지금은 못 한다」가 정보다).
#
# ⚠ `feasibility` 의 판정 정본은 `.orch/R71/result_9.md` 다 — 이 파일은 그것을 «옮긴»
#   자리이고, 다시 판단하는 자리가 아니다. 어긋나 보이면 그 조사부터 고친다.
#
# ── ⚠⚠⚠ 방안 둘이 **같은 자리**를 쓰면 그 Δ 를 더하지 마라 ───────────────────
#
# `small_ess_max_pv_export` 는 `pv_capacity_up`(`design_capacity.pv_capacity_kw`) ·
# `ess_capacity_down`(`design_capacity.ess_capacity_kwh`) ·
# `pv_allocation_battery_first`(`operation_options.pv_allocation_priority`) 를
# **이미 품고 있다.** 그것들을 함께 더하면 **같은 개선을 두 번·세 번 센다** — 검수가
# 실물로 잡은 결함이고(`.orch/R71/WP-10-fix.md` §0), 그 합은 *「결손의 9.5%만 남는다」*
# 로 읽혔으나 그 구성 하나를 적용한 값은 **결손의 49.2%가 남는** 것이었다.
# ⇒ 도구는 **Δ 내림차순으로 훑어 앞서 고른 것과 겹치지 않는 방안만** 합계 A 에 넣고,
#   건너뛴 것을 **사유와 함께 전부 인쇄한다**(`improvement_ledger.py::
#   choose_without_overlap`). **새 방안을 더할 때 그 `apply` 가 어느 자리를 쓰는지 보라.**

improvements:
  - id: pv_allocation_battery_first
    title: "PV 잉여 배분을 「배터리 우선」으로 바꾼다 — 돈이 안 드는 운전 변경"
    lever: "구성"
    precondition: "ⓑ"
    rationale: >-
      기본 배분(집 우선)은 PV 잉여를 집에서 먼저 쓰고 남지 않아 계통으로 나가는
      전력이 0kWh 다. 배터리 우선으로 바꾸면 역송이 생기고 잉여판매·REC 가 처음으로
      0원을 벗어난다. **설비를 사지도 제도를 바꾸지도 않는다** — 운전 방법의 선택이다.
    source: >-
      `core/der/pv.py::PVAllocationPriority` 가 선언한 선택지이며 단가·비용을 손대지
      않는다. 즉 이 방안에는 「틀릴 수 있는 값」이 없다.
    feasibility: "확인"
    feasibility_source: >-
      ★ **설비·제도·계약 어느 것도 새로 필요 없다** — 운전 파라미터 하나를 바꾸는
      일이다(조사 `.orch/R71/result_9.md` §1·§3 1위). 남는 선행조건은 **양방향
      계량기 존재 여부**이며 그것은 **미확인**이다(계통연계 설비면 통상 있다는 것이
      그 조사의 추론). 근거의 등급 — 이 방안 자체는 저장소 선언이라 판정할 원문이
      없다. 역송이 열리면 함께 걸리는 요건 중 **REC 발급 자격은 별표2 비고19 로
      원문 확인**됐고 **양방향 계량기 유무는 미확인**이다.
    apply:
      operation_options:
        pv_allocation_priority: "배터리 우선"

  - id: surplus_sale_at_current_price
    title: "위 배분 변경 + 현행 단가(110원/kWh)로 잉여를 판다 — 단가를 안 올린 효과"
    lever: "구성"
    precondition: "ⓑ"
    rationale: >-
      단가를 올리지 않고 **역송을 만드는 것만의 효과**를 가른다. 위 방안과 같은 크기가
      나오는 것이 정상이며(오버라이드가 대장 값을 그대로 다시 적은 것이므로), 그
      동일성이 곧 *「잉여판매 수입은 단가가 아니라 배분이 열었다」* 의 증거다.
    source: >-
      `docs/assumptions.yaml` `tariff.surplus_direct_sale` — `track: assume` ·
      `value: 110` 원/kWh · 2026년 기준. 현행 값을 그대로 쓴다.
    feasibility: "확인"
    feasibility_source: >-
      ★ 위 `pv_allocation_battery_first` 과 **같은 판정**이다 — 단가를 대장 값으로
      그대로 다시 적은 것이므로 새로 필요한 설비·제도·계약이 없다(조사
      `.orch/R71/result_9.md` §1 마지막 행 · §3 1위). 선행조건도 같다 — **양방향
      계량기 존재 여부는 미확인**이다. 근거의 등급 — 이 방안이 쓰는 단가는 대장의
      현행 값이라 값 쪽에 판정할 것이 없고, 잉여 판매 경로 자체를 「제도적으로 이미
      허용된 경로」로 적은 같은 조사 §1 의 판단은 **간접자료**다.
    apply:
      operation_options:
        pv_allocation_priority: "배터리 우선"
      assumption_overrides:
        - key: "tariff.surplus_direct_sale"
          value: 110
          reason: "현행 대장 값을 그대로 적어 「단가를 안 올렸다」를 명시한다"

  - id: surplus_sale_price_up
    title: "위 + 잉여 판매단가를 150원/kWh 로 올린다"
    lever: "단가"
    precondition: "ⓒ"
    rationale: >-
      잉여 판매단가는 SMP 계열 정산단가이므로 사업자가 고르는 값이 아니다 — 제도·계약이
      정한다. 그 단가가 대장이 스스로 적은 검토 상한까지 올랐을 때의 크기를 본다.
    source: >-
      `docs/assumptions.yaml` `tariff.surplus_direct_sale` 의
      `sensitivity.high` = 150 원/kWh (`low 80 · base 110 · high 150`).
      **대장 밖의 수를 지어내지 않았다.** ★ 이 값은 **2026-08 SMP 월평균 실측
      147.88원/kWh 에 근접**하다(대장 `tariff.surplus_direct_sale` 이 인용한 R52
      실측을 조사 `.orch/R71/result_9.md` §1 이 재확인했다) — 「검토 상한」이 아니라
      **관측치에 가까운 값**이다.
    feasibility: "조건부"
    feasibility_source: >-
      ★ **근거가 두텁다** — 150원/kWh 이 2026-08 SMP 실측 147.88원/kWh 에 근접해
      값의 현실성이 오히려 확인되는 쪽이다(조사 `.orch/R71/result_9.md` §1·§3 4위).
      ⚠ **다만 SMP 는 연료비 연동으로 월마다 크게 변하므로 고정값으로 쓰는 위험이
      남는다** — 그래서 `확인` 이 아니라 `조건부` 다. 선행조건은 배분 변경(즉시
      가능)과 잉여전력 판매 계량·정산 경로다. 근거의 등급 — 판매 경로를 정한
      「소규모 신·재생에너지 발전전력 등의 거래에 관한 지침」은 존재만 확인했고 조문을
      열지 못했다(**간접자료**), SMP 실측은 대장이 인용한 값이다.
    apply:
      operation_options:
        pv_allocation_priority: "배터리 우선"
      assumption_overrides:
        - key: "tariff.surplus_direct_sale"
          value: 150
          reason: "대장이 적은 검토 범위의 상한(sensitivity.high)"

  - id: rec_price_up
    title: "위 + REC 단가를 110원/kWh 로 올린다"
    lever: "단가"
    precondition: "ⓒ"
    rationale: >-
      REC 수익은 계통으로 나간 kWh 에 단가를 곱한다. 역송이 열린 뒤에야 단가가 뜻을
      가지며, 그 단가는 인증서 시장이 정한다.
    source: >-
      `docs/assumptions.yaml` `benefit.rec_price` 의 `sensitivity.high` = 110 원/kWh
      (`low 45 · base 70 · high 110`). ⚠ 단위는 `원/REC` 가 아니라 `원/kWh` 다.
      ★ **발급 자격의 정본은 별표2 비고19 다** — 「신·재생에너지 공급인증서 발급 및
      거래시장 운영에 관한 규칙」 별표2 비고19 를 조사가 **원문으로 확인**했다
      (`.orch/R71/result_9.md` §0-C·§5-1): *「자가용 발전설비를 통해 전력을 거래하는
      경우 … 가중치가 1.0을 초과하는 경우에는 가중치 1.0을 적용한다」* — 즉 대장의
      `benefit.rec_weight_pv` = 1.0 은 **우연히 맞은 값이 아니라 제도가 그렇게 정한
      값**이었다. ⚠ 다만 **단가 110원/kWh 은 관측(2026-09 KPX 「오늘의 REC」 평균
      ≈70.6원/kWh)보다 높은 상방값**이다.
    feasibility: "조건부"
    feasibility_source: >-
      ★ **발급 자격은 제도가 열어 두었다 — 원문 확인.** 별표2 비고19 가 자가용
      발전설비의 거래를 발급 대상으로 두고 가중치 상한을 1.0 으로 정한다(조사
      `.orch/R71/result_9.md` §0-C 등급 A · §1 · §3 3위). ⚠ **다만 단가 110원/kWh
      은 관측치(≈70.6원/kWh)보다 높은 상방값**이라 이 Δ 는 상한으로 읽어야 한다 —
      그래서 `확인` 이 아니라 `조건부` 다. 선행조건은 REC 발급 신청 · 계량 · **잉여
      판매 실적**(배분 변경이 선행)이다. 근거의 등급 — 발급 자격 **원문 확인**,
      단가는 대장이 인용한 시장 관측치다.
    apply:
      operation_options:
        pv_allocation_priority: "배터리 우선"
      assumption_overrides:
        - key: "benefit.rec_price"
          value: 110
          reason: "대장이 적은 검토 범위의 상한(sensitivity.high)"

  - id: cp_registration
    title: "준중앙급전 자원으로 등록해 용량정산금(CP)을 받는다"
    lever: "제도"
    precondition: "ⓒ"
    rationale: >-
      ESS 운전 방법을 「준중앙급전 등록」으로 두면 CP 편익이 켜진다(등록 용량 × 단가 ×
      12개월). ⚠ 이 방안은 **피크 저감 편익을 포기하는 대가**를 함께 낸다 — 같은 ESS 를
      두 목적에 동시에 쓸 수 없기 때문이며, 도구가 재는 Δ 는 그 상계 후의 값이다.
    source: >-
      ★ **근거 없음 — 크기만 보는 가정.** 대장 `benefit.cp_price` 는
      `track: default0` · `value: 0` 이고 그 `derivation_method` 가 *「가정하지 않는다.
      CP 는 현행 제도이나 분산특구 내 ESS 에 적용할 산정 기준이 부재하다」* 라고 적는다.
      여기 적은 10,000 원/kW·월은 **제도 근거가 아니라 크기를 보려는 수**다.
    feasibility: "불가"
    feasibility_source: >-
      ⛔ **분산특구 내 ESS 에 적용할 산정 기준이 부재하다** — 그것이 대장의 1차
      판단(`benefit.cp_price` 의 `derivation_method` · R48 §6)이고, 조사가 그 판단을
      뒤집을 자료를 **찾지 못했다**(`.orch/R71/result_9.md` §1·§3 7위). 등록 용량
      하한도, **정산 단위가 원/kW 인지 원/kWh 인지도** 확정하지 못했다(같은 조사
      §5-4 는 대장의 「원/kW·월」 표기와 시장 서술이 어긋날 가능성까지 적어 두었다).
      근거의 등급 — 전력시장운영규칙 [별표2] 원문을 **열지 못했다**(검색 요약만 · 축3
      C등급 · **미확인**). ⇒ 이 방안의 Δ 는 **크기일 뿐이며 합계에 넣지 않는다.**
    apply:
      operation_options:
        ess_operating_mode: "준중앙급전 등록"
      assumption_overrides:
        - key: "benefit.cp_price"
          value: 10000
          reason: "개선 방안 평가용 가정값 — 제도 근거 없음"

  - id: grid_tariff_down
    title: "계통 구매단가를 100원/kWh 로 낮춘다 — 계약종별 변경"
    lever: "단가"
    precondition: "ⓒ"
    rationale: >-
      이 사업의 운영비는 현가의 98.7% 가 계통 전력 구매 한 항이다
      (`.orch/R71/result_5.md` §1) — 값 하나로 표현되는 자리 중 결손에 가장 크게 닿는다.
      ⚠⚠ **그러나 계약종별은 사업자가 고르는 선택지가 아니라 실제 «용도»로 정해진다**
      (한전 기본공급약관 제56조 · 제67조③ 단서 — 조사 `.orch/R71/result_9.md` §1 이
      원문으로 확인). 아파트는 원칙적으로 **주택용전력**이고, 고압공급아파트가 종합계약을
      신청한 경우에 한해 **공동설비 사용분만** 일반용(갑)을 적용받는다. **세대별 사용분
      — 이 사업 부하의 대부분 — 은 이 경로로 못 옮긴다.** ⇒ 이 방안의 크기는 「단가를
      낮출 수 있다면」의 크기이며, 「낮출 수 있다」가 아니다.
    source: >-
      `docs/assumptions.yaml` `tariff.hv_single_contract.energy_only` 의
      `sensitivity` 구간 안의 값 (`low 80 · base 120 · high 170`).
      구간 하한(80)이 아니라 100 을 적은 이유는 `.orch/R71/result_5.md` §3ⓑ 가
      **같은 값으로 이미 재 두어 대조가 되기 때문**이다. ⚠ 조사는 이 100 이 **어느
      계약종별의 어느 부하시간대 단가인지 특정되지 않았다**는 어긋남을 적어 두었다
      (`.orch/R71/result_9.md` §1).
    feasibility: "미확인"
    feasibility_source: >-
      ⛔⛔ **「할 수 없다」고 확정된 것이 아니라 «선행 사실을 모른다» — 그래서
      `미확인` 이다**(오케 판정 `.orch/R71/WP-10-fix.md` §1③). 조사는 계약종별이
      **고르는 것이 아니라 실제 용도로 정해진다**는 것까지 확인했다: 아파트는
      원칙적으로 주택용전력(한전 기본공급약관 제56조)이고, **고압공급아파트가 종합계약을
      신청한 경우에 한해 공동설비 사용분만** 일반용(갑) 고압요금을 적용받는다(제67조③
      단서). **세대별 사용분 — 이 사업 부하의 대부분 — 은 이 경로로 못 옮긴다**
      (`.orch/R71/result_9.md` §1·§3 6위·§5-2). ⚠⚠ **그런데 그 판정 자체가 선행
      사실에 달려 있다** — 조사가 스스로 적었듯 이 사업에서 한전과의 관계가 ⓐ **세대별
      주택용 소매요금**인가 ⓑ **분산에너지사업자의 도매 전력구매계약**인가가
      **미확인**이고, ⓑ 라면 계약종별 개념 자체가 다르게 적용될 수 있다. ★ **선행
      질문은 `todo-개선방안조사.md` 1번**이다 — *「이 사업의 «실제 계약 형태»가
      무엇인가 · 사업계획서·협약서를 봐야 한다」*(같은 파일 2번이 이 방안의 조사
      항목이며 *「1차 조사가 「거의 불가」로 봤다」* 로 적혀 있다). 근거의 등급 — 약관
      제8장(제66~82조) **원문 확인**(축3 A/B) · 제56조 전문은 검색 요약(**간접자료**)
      · **이 사업의 계약 형태는 미확인**. ⇒ 그래서 이 Δ 는 **합계에서 빠진다.**
    apply:
      assumption_overrides:
        - key: "tariff.hv_single_contract.energy_only"
          value: 100
          reason: "대장이 적은 검토 범위 안의 값 · WP-5 실측과 대조되는 값"

  - id: pv_capacity_up
    title: "PV 용량을 한 호당 6.0kW 로 늘린다"
    lever: "구성"
    precondition: "ⓑ"
    rationale: >-
      PV 를 키우면 결론이 좋아진다 — 취득비가 늘어도 회피하는 구매 전력이 더 크기
      때문이다. ⚠ 부호가 ESS 와 반대인 자리이므로 **둘을 「설비를 더 넣는다」로 묶어
      읽지 말 것**(아래 `ess_capacity_down` 과 §5 참조).
    source: >-
      `core/casegrid/ledger_levels.py::_DESIGN_VARS` 의 PV 탐색 구간 안의 값
      (`low 1.0 · base 3.0 · high 9.0` kW/호). 설계 용량은 시장에서 관측한 값이 아니라
      **사업자가 고르는 설계**이므로 대장 항목이 아니다.
    feasibility: "조건부"
    feasibility_source: >-
      **제도 장벽은 낮아 보이나 확인하지 못했다**(조사 `.orch/R71/result_9.md` §1·§3
      5위 — 「인허가 장벽은 낮아 보이나 확인 못함」). ⚠⚠ **총 용량이 늘면 계통연계
      용량 재심사가 필요한지 미확인**이다(60kW → 120kW). ⚠⚠ 그리고 **지붕 면적·구조
      심의는 이 모델이 재지 않는다** — 건축·소방·구조 심의가 선행이며 그 통과 여부는
      이 Δ 안에 없다. 근거의 등급 — **미확인**(1차 자료로 확인한 것이 없다. 취득비
      증가는 이미 Δ 에 반영되어 있으므로 남는 것은 제도·물리 심의뿐이다).
    apply:
      design_capacity:
        pv_capacity_kw: 6.0

  - id: ess_capacity_down
    title: "ESS 용량을 한 호당 5.0kWh 로 줄인다 — 돈이 안 드는 자리"
    lever: "구성"
    precondition: "ⓑ"
    rationale: >-
      ESS 를 2배로 늘리면 결손이 9,558만원 더 커진다는 실측(`.orch/R71/result_5.md`
      §3ⓐ)이 가리킨 반대 방향이다. 고정 O&M 은 용량 비례가 아닌데 취득비·교체비는
      비례하므로, **줄이는 것이 개선 방안일 수 있다.** 설비를 덜 사는 일이라 제도·계약이
      필요 없고 즉시 된다 — 그래서 실행 가능성이 가장 높은 자리일 수 있다.
    source: >-
      `core/casegrid/ledger_levels.py::_DESIGN_VARS` 의 ESS 탐색 구간 안의 값
      (`low 2.0 · base 10.0 · high 30.0` kWh/호).
    feasibility: "확인"
    feasibility_source: >-
      ★ **설비를 «덜» 사는 방향이라 제도 장벽이 없다**(조사 `.orch/R71/result_9.md`
      §1·§3 2위 — 「설비를 덜 사는 방향이라 제도·계약 장벽이 없다 · 즉시 가능」).
      ⚠ 남는 위험은 **설계 안전율**(정전 대응 등 다른 목적과 상충하는지)이며 그것은
      **제도가 아니라 사업 판단**이다. 근거의 등급 — 제도 근거가 필요하지 않은
      자리이므로 판정할 원문이 없다(값은 저장소의 탐색 구간 선언이다).
    apply:
      design_capacity:
        ess_capacity_kwh: 5.0

  - id: small_ess_max_pv_export
    title: "저장장치를 최소로 두고 태양광을 최대로 늘려 잉여를 판매한다"
    lever: "구성"
    precondition: "ⓑ"
    rationale: >-
      ★★ **지금까지 가장 큰 방안이다.** 사용자 제안(피크 한정 공급 → 작은 ESS ·
      초과전력을 재생전력으로 판매)을 오케스트레이터가 실측한 구성이며, ESS 를 탐색
      구간 하한(2.0kWh/호 · 단지 40kWh)으로 두고 PV 를 상한(9.0kW/호 · 단지 180kW)까지
      올린 뒤 배분을 「배터리 우선」으로 돌려 역송을 연다. ★ **실측** — PV 단독
      +60,583,606원(`pv_capacity_up` · 6.0kW/호) · ESS 축소 단독 +40,764,102원
      (2.0kWh/호) 인데 **함께 적용하면 +205,168,638원**이다. **단순 합
      101,347,708원보다 훨씬 크다 — 상호작용이 있다.** ⚠ 두 단독 실측 중 PV 쪽은
      6.0kW/호 값이므로 그 차에는 9.0kW/호까지의 증분도 섞여 있다. ⚠⚠ **최대수요
      위험** — 한전 기본요금은 **15분 최대수요**에 걸리고 한 번 놓치면 그 값이 최대
      12개월의 요금적용전력을 정한다(약관 제68조① · 조사 `.orch/R71/result_9.md` §3).
      **ESS 를 최소로 두는 설계는 그 규칙과 정면으로 만난다 — 이 방안의 가장 큰
      위험이다.**
    source: >-
      `core/casegrid/ledger_levels.py::_DESIGN_VARS` 의 탐색 구간 **상·하한**
      (PV `high 9.0` kW/호 · ESS `low 2.0` kWh/호)과 `core/der/pv.py::
      PVAllocationPriority` 의 선택지뿐이다. ⛔ **단가 오버라이드를 넣지 않았다** —
      단가를 얹는 것은 위 `surplus_sale_price_up`·`rec_price_up` 과 **같은 자리를 두
      번 세는 일**이다. 즉 이 방안에는 「틀릴 수 있는 시장 값」이 없고, 남는 것은
      **설계가 물리적으로·제도적으로 가능한가**뿐이다.
    feasibility: "조건부"
    feasibility_source: >-
      ⚠⚠ **이 모델이 재지 «않는» 것이 둘이다.** ⓐ **지붕 면적·구조 심의** — 9kW/호
      (단지 180kW)가 물리적으로 올라가는지를 이 모델은 묻지 않는다. ⓑ **계통이 그
      역송을 받아 주는가** — `policy.grid_supply_allowance` 는 **실측상 실행에 영향이
      없다**(선언만 있고 배선이 없는 값이다 · `.orch/R71/result_5.md`). ⚠⚠ 그리고
      **최대수요 위험**이 남는다 — 기본요금은 15분 최대수요에 걸리고 한 번 놓치면 그
      값이 최대 12개월의 요금적용전력을 정하므로(약관 제68조① **원문 확인** ·
      `.orch/R71/result_9.md` §3), **ESS 를 최소로 두는 설계는 그 요금 규칙과 정면으로
      만난다.** ⇒ 제도 장벽이 «확인되지 않았다»는 것이 유리한 신호일 수 있으나
      「제도가 허용한다」고 단정할 근거도 없다(같은 조사의 사용자 제안 판정). 근거의
      등급 — 최대수요 규칙 **원문 확인**, 계통연계·구조 심의는 **미확인**.
    apply:
      design_capacity:
        ess_capacity_kwh: 2.0
        pv_capacity_kw: 9.0
      operation_options:
        pv_allocation_priority: "배터리 우선"

# ── 방안이 «아닌» 것 — 같은 축을 재지만 목록에서 빼는 것들 ────────────────────
#
# ★ 왜 같은 파일에 두는가: 이것들도 **같은 오버레이로 재는 축**이고, 재지 않으면
#   산출물 §5 가 *「방안이 아니다」* 만 말하고 **크기를 말하지 못한다.** 다른 파일로
#   가르면 그 절이 낡거나(축이 바뀌어도 §5 는 옛말을 한다) 도구가 수를 베껴 인쇄하게
#   된다. 도구는 이 목록을 **§2 가 아니라 §5** 에 인쇄하며 합계(§4)에 넣지 않는다.
# ⚠ 칸은 위와 같고 `why_not` 하나가 더 필수다 — 그 칸이 비면 도구가 거부한다.
# ⚠⚠ 여기의 `feasibility` 는 **제도가 허용하는가**만 말한다 — *「왜 방안이 아닌가」*
#   는 `why_not` 이 진다. 아래 셋은 **제도가 막는 것이 아니라** 목적을 지우거나
#   (앞의 둘) 결론을 악화시켜서(마지막) 방안이 아니다. 두 칸을 섞어 읽지 마라.

not_improvements:
  - id: ev_load_zero
    title: "전기차 충전 부하를 0 으로 둔다"
    lever: "구성"
    precondition: "ⓑ"
    rationale: >-
      한 호당 연 2,784kWh 인 전기차 충전 부하를 지우면 계통 구매가 그만큼 줄어 결손이
      크게 작아진다. 크기로는 상위권이다.
    source: >-
      `docs/assumptions.yaml` `load.ev.annual` — `track: assume` · `value: 2784`
      kWh/호·년. 0 은 「그 부하가 없는 사업」이라는 뜻이다.
    feasibility: "확인"
    feasibility_source: >-
      **제도가 막는 자리가 아니다** — 전기차 충전 부하가 «없는» 사업을 짓는 것은
      제도·계약이 허락하고 말고 할 것이 아니다. ⇒ 이 항목이 방안이 아닌 이유는
      제도가 아니라 **사업의 목적**이며 그것은 `why_not` 이 적는다.
    why_not: >-
      ⛔ 그 부하가 **이 사업의 목적**이다(오케 판정 `.orch/R71/WP-7.md` §2③ ·
      `docs/decisions-2026-09-18-R71.md` §5 ⑤). *「목적을 지우면 경제성이 좋아진다」* 는
      답은 방안이 아니다. ⇒ 이 크기는 **사업 규모의 지표**로만 읽는다.
    apply:
      assumption_overrides:
        - key: "load.ev.annual"
          value: 0
          reason: "방안이 아니라 사업 규모를 재는 참고 축"

  - id: heatpump_load_zero
    title: "히트펌프 부하를 0 으로 둔다"
    lever: "구성"
    precondition: "ⓑ"
    rationale: >-
      한 호당 연 3,289kWh 인 히트펌프 부하를 지우면 같은 방향으로 결손이 작아진다.
    source: >-
      `docs/assumptions.yaml` `load.heatpump.annual` — `track: assume` ·
      `value: 3289.0` kWh/호·년.
    feasibility: "확인"
    feasibility_source: >-
      위와 같다 — **제도가 막는 자리가 아니다.** 냉난방·급탕 부하가 없는 사업을
      짓는 것은 제도 문제가 아니고, 이 항목이 방안이 아닌 이유는 `why_not` 이 적는다.
    why_not: >-
      ⛔ 위와 같다 — 냉난방·급탕의 전기화가 이 사업의 목적이다.
      ⚠ 하위 항목(`load.heatpump.{heating,cooling,hotwater}.annual`)으로 쪼개 묻는 것은
      **지금 안 된다** — 대장이 그 셋을 표시·독립 민감도 용도로 선언하고 계산 경로는
      부모 키가 읽는다(`.orch/R71/result_5.md` §4).
    apply:
      assumption_overrides:
        - key: "load.heatpump.annual"
          value: 0.0
          reason: "방안이 아니라 사업 규모를 재는 참고 축"

  - id: ess_capacity_up
    title: "ESS 용량을 한 호당 20.0kWh 로 늘린다"
    lever: "구성"
    precondition: "ⓑ"
    rationale: >-
      「저장장치를 더 넣자」가 개선 방안인지 묻는 자리다. 방향이 반대인 것을 함께 재어
      `ess_capacity_down` 의 부호가 우연이 아님을 보인다.
    source: >-
      `core/casegrid/ledger_levels.py::_DESIGN_VARS` 의 ESS 탐색 구간 안의 값
      (`low 2.0 · base 10.0 · high 30.0` kWh/호).
    feasibility: "확인"
    feasibility_source: >-
      **제도 장벽이 없다** — 설비를 더 사는 것은 제도·계약의 일이 아니다(줄이는 쪽인
      `ess_capacity_down` 과 같은 판정이다). ⇒ 이 항목이 방안이 아닌 이유는 제도가
      아니라 **결론이 악화되기 때문**이며 그것은 `why_not` 이 적는다.
    why_not: >-
      ⛔ **악화된다.** 취득비·교체비는 용량에 비례하는데 이 구성에서 늘어난 저장으로
      더 버는 돈이 그만큼 되지 않는다. 산출물이 이 수를 음수로 인쇄하는 것이
      *「설비를 더 넣는다」가 이 사업의 답이 아니다* 의 증거다.
    apply:
      design_capacity:
        ess_capacity_kwh: 20.0
