# 편익 배타 규칙 — spec FR-402-AC2.A~.D · FR-402-AC4
#
# **이 파일이 정본이다.** 코드에 같은 표를 다시 두지 않는다 — FR-402-AC4 가
# 요구하는 «선언적 규칙 테이블» 이 그것이고, `if benefit_a == "REC" and ...`
# 로 짜면 제도 개정이 코드 배포를 요구한다.
#
# R15 가 요금표(`FR-501-AC4`)에서 같은 판단을 했다. 그때의 검증 방식이
# 여기에도 그대로 적용된다 — **로더가 있는지가 아니라, 같은 코드에 이 파일만
# 바꿔 결과가 달라지는지**를 고정한다.
#
# 유형 (spec FR-402-AC2):
#   A  동일 물리량 이중 판매        차단 100% (음성 검증)
#   B  인과 하류가 상류에 이미 포함  오탐 0 (양성 검증)
#   C  동일 효과의 이중 화폐화       오탐 0
#   D  제도적 배타                   오탐 0
#
# `applies_to_profile` 을 비우면 «모든 규제 프로파일에 적용» 이다. 제도 한정
# 규칙만 프로파일 이름을 둔다 (FR-504).

version: 1

rules:
  - benefit_a: SelfConsumption
    benefit_b: SurplusSale
    type: A
    rationale: 같은 1 kWh 를 자가소비 절감과 잉여판매로 동시 계상할 수 없다

  - benefit_a: SurplusSale
    benefit_b: DirectTrade
    type: A
    rationale: 같은 잉여량을 상계거래와 직접거래로 동시 정산할 수 없다

  - benefit_a: DistributedBenefit
    benefit_b: SelfConsumption
    type: B
    rationale: >-
      송배전 회피·손실 감소는 현행 망이용요금에 반영 — 미래 증설 회피 증분만
      계상 (원칙 2-1)

  - benefit_a: REC
    benefit_b: SurplusSale
    type: D
    rationale: 상계거래 참여 설비의 REC 발급 제한 (제도 한정)
    applies_to_profile: net_metering

  # ── R31 신설 — **계약구조 축** (결정 §2-4) ─────────────────────────
  #
  # 바로 위 규칙은 `applies_to_profile: net_metering` 으로만 걸린다. 그런데
  # `ContractConfig.structure`(FR-205)와 `RegulationProfile`(FR-504)은 **완전히
  # 독립된 두 축**이므로, 사용자가 「상계거래」를 고르고도 다른 규제 프로파일을
  # 선택하면 **위 규칙이 조용히 걸리지 않는다** — 설계서가 지적한 REC 이중 계상
  # 위험이 정확히 그것이다.
  #
  # **구조 선택이 프로파일을 자동 강제하게 하지 않았다.** 두 축을 묶으면 새
  # 구조·새 프로파일 조합마다 매핑 코드를 고치게 된다. 대신 같은 금지를 **구조
  # 축으로 한 번 더** 선언한다 — 어느 프로파일을 골랐든 구조가 상계거래이면
  # 걸린다. 거부는 이미 실행 경로에 배선된 `assert_no_exclusions()` 가 담당한다.
  #
  # ⚠ **위 규칙과 쌍이 같으므로 이 표에 그대로 더할 수 없다** — 로더가 «이미
  # 선언된 쌍» 으로 막는다(양방향 대칭이라 한 번만 적는 규약). 그래서 상계
  # 구조에서 실제로 켜지는 편익 쌍으로 적는다: 상계는 `SurplusSale` 로 조립되고
  # (`core/valuestream/settlement.py`), REC 는 그 위에 얹히려 하는 쪽이다.
  # 유형은 위와 같은 **D(제도적 배타)** 다 — 물리량 이중이 아니라 제도가 금지한다.
  - benefit_a: REC
    benefit_b: DistributedBenefit
    type: D
    rationale: >-
      상계거래 구조에서는 REC 발급이 제한되므로, REC 를 켠 채 분산편익 크레딧까지
      계상하면 제도가 인정하지 않는 두 수익이 함께 잡힌다. **프로파일이 아니라
      구조로 걸린다** — 두 축이 독립이라 프로파일만으로는 조용히 통과한다
      (R31 결정 §2-4)
    applies_to_structure: 상계거래
