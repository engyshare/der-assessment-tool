# 편익 배타 규칙 — spec FR-402-AC2.A~.E · FR-402-AC4
#
# **이 파일이 정본이다.** 코드에 같은 표를 다시 두지 않는다 — FR-402-AC4 가
# 요구하는 «선언적 규칙 테이블» 이 그것이고, `if benefit_a == "REC" and ...`
# 로 짜면 제도 개정이 코드 배포를 요구한다.
#
# R15 가 요금표(`FR-501-AC4`)에서 같은 판단을 했다. 그때의 검증 방식이
# 여기에도 그대로 적용된다 — **로더가 있는지가 아니라, 같은 코드에 이 파일만
# 바꿔 결과가 달라지는지**를 고정한다.
#
# 유형 (spec FR-402-AC2):
#   A  동일 물리량 이중 판매        차단 100% (음성 검증)
#   B  인과 하류가 상류에 이미 포함  오탐 0 (양성 검증)
#   C  동일 효과의 이중 화폐화       오탐 0
#   D  제도적 배타                   오탐 0
#   E  동시에 성립할 수 없는 운전     오탐 0
#
# `applies_to_profile` 을 비우면 «모든 규제 프로파일에 적용» 이다. 제도 한정
# 규칙만 프로파일 이름을 둔다 (FR-504).

version: 1

rules:
  - benefit_a: SelfConsumption
    benefit_b: SurplusSale
    type: A
    rationale: 같은 1 kWh 를 자가소비 절감과 잉여판매로 동시 계상할 수 없다

  - benefit_a: SurplusSale
    benefit_b: DirectTrade
    type: A
    rationale: 같은 잉여량을 상계거래와 직접거래로 동시 정산할 수 없다

  - benefit_a: DistributedBenefit
    benefit_b: SelfConsumption
    type: B
    rationale: >-
      송배전 회피·손실 감소는 현행 망이용요금에 반영 — 미래 증설 회피 증분만
      계상 (원칙 2-1)

  - benefit_a: REC
    benefit_b: SurplusSale
    type: D
    rationale: 상계거래 참여 설비의 REC 발급 제한 (제도 한정)
    applies_to_profile: net_metering

  # ── R31 신설 — **계약구조 축** (결정 §2-4) ─────────────────────────
  #
  # 바로 위 규칙은 `applies_to_profile: net_metering` 으로만 걸린다. 그런데
  # `ContractConfig.structure`(FR-205)와 `RegulationProfile`(FR-504)은 **완전히
  # 독립된 두 축**이므로, 사용자가 「상계거래」를 고르고도 다른 규제 프로파일을
  # 선택하면 **위 규칙이 조용히 걸리지 않는다** — 설계서가 지적한 REC 이중 계상
  # 위험이 정확히 그것이다.
  #
  # **구조 선택이 프로파일을 자동 강제하게 하지 않았다.** 두 축을 묶으면 새
  # 구조·새 프로파일 조합마다 매핑 코드를 고치게 된다. 대신 같은 금지를 **구조
  # 축으로 한 번 더** 선언한다 — 어느 프로파일을 골랐든 구조가 상계거래이면
  # 걸린다. 거부는 이미 실행 경로에 배선된 `assert_no_exclusions()` 가 담당한다.
  #
  # ⚠ **위 규칙과 쌍이 같으므로 이 표에 그대로 더할 수 없다** — 로더가 «이미
  # 선언된 쌍» 으로 막는다(양방향 대칭이라 한 번만 적는 규약). 그래서 상계
  # 구조에서 실제로 켜지는 편익 쌍으로 적는다: 상계는 `SurplusSale` 로 조립되고
  # (`core/valuestream/settlement.py`), REC 는 그 위에 얹히려 하는 쪽이다.
  # 유형은 위와 같은 **D(제도적 배타)** 다 — 물리량 이중이 아니라 제도가 금지한다.
  - benefit_a: REC
    benefit_b: DistributedBenefit
    type: D
    rationale: >-
      상계거래 구조에서는 REC 발급이 제한되므로, REC 를 켠 채 분산편익 크레딧까지
      계상하면 제도가 인정하지 않는 두 수익이 함께 잡힌다. **프로파일이 아니라
      구조로 걸린다** — 두 축이 독립이라 프로파일만으로는 조용히 통과한다
      (R31 결정 §2-4)
    applies_to_structure: 상계거래

  # ── R32 신설 — **집합 PPA 는 전량 판매다** ──────────────────────────
  #
  # `AggregatedPPA` 는 발전량 **전량**을 팔고, `SurplusSale` 은 계통 역송분(잉여)
  # 만 본다. 그러므로 PPA 를 켠 채 잉여판매를 켜면 이미 넘긴 kWh 를 한 번 더 파는
  # 것이고, 자가소비 절감을 켜면 넘긴 kWh 를 집에서 또 쓴 것으로 계상된다.
  #
  # ⚠ **둘을 다 적는 것이 요점이다.** 잉여판매만 막으면 **자가소비와 PPA 를 동시에
  # 켤 수 있고**, 그 조합의 결과는 아무 예외 없이 그럴듯하다 — 편익이 커진 쪽으로
  # 틀리므로 필요 지원 규모가 과소 산정된다(원칙 2-1 이 막으려는 방향).
  - benefit_a: AggregatedPPA
    benefit_b: SurplusSale
    type: A
    rationale: 집합 PPA 는 발전량 전량을 팔았으므로 같은 kWh 를 잉여로 다시 팔 수 없다

  - benefit_a: AggregatedPPA
    benefit_b: SelfConsumption
    type: A
    rationale: 집합 PPA 로 넘긴 kWh 는 자가소비가 아니다 — 동일 물리량 이중 계상

  # ── R48 신설 — **운전 주체 축** (판정 §2 · spec FR-402-AC2.E) ───────────
  #
  # 위 규칙들은 전부 **「계상해도 되는 편익 둘을 동시에 세면 안 된다」** 를 말한다.
  # R48 사용자 판정이 세운 축은 그것이 아니다 — **방전 시점을 누가 정하는가**가
  # 갈리므로 두 편익이 **애초에 같은 운전에 함께 존재할 수 없다.**
  #
  #     사용자 운전 : 방전 시점을 사업자가 정한다 → SelfConsumption · PeakShaving
  #     계통 급전   : 방전 시점을 계통운영자가 정한다 → NWAs · CP
  #
  # ⚠ **`applies_to_profile` 을 비운다** — 제도 한정이 아니다. 제도가 바뀌어도
  # 성립하지 않으므로 유형 `D` 가 아니고, 같은 kWh 를 두 번 파는 것이 아니므로
  # 유형 `A` 도 아니다. `E` 는 **「막는」 규칙이 아니라 「성립하지 않음을 선언」**
  # 하는 규칙이다 (spec FR-402-AC2.E 신설 사유).
  #
  # ⚠ **넷을 다 적는다.** 계통 급전 편익 둘 × 사용자 운전 편익 둘 = 4쌍이며,
  # 하나라도 빠지면 그 조합만 조용히 열린 채 남는다 — R32 가 집합 PPA 에서
  # 「잉여판매만 막으면 자가소비와 동시에 켤 수 있다」로 밟은 자리와 같다.
  - benefit_a: NWAs
    benefit_b: SelfConsumption
    type: E
    rationale: >-
      방전 시점을 계통운영자가 정하면 사용자가 원하는 시각에 방전할 수 없고
      사용자의 전기사용량에 영향이 없다 — 자가소비가 성립하지 않는다
      (R48 판정 §2)

  - benefit_a: NWAs
    benefit_b: PeakShaving
    type: E
    rationale: >-
      방전 시점을 계통운영자가 정하면 사용자가 원하는 시각에 방전할 수 없고
      사용자의 전기사용량에 영향이 없다 — 자가 피크 저감이 성립하지 않는다
      (R48 판정 §2)

  - benefit_a: CP
    benefit_b: SelfConsumption
    type: E
    rationale: >-
      준중앙급전으로 등록하면 방전 시점을 계통운영자가 정하므로 사용자가 원하는
      시각에 방전할 수 없고 사용자의 전기사용량에 영향이 없다 — 자가소비가
      성립하지 않는다 (R48 판정 §2)

  - benefit_a: CP
    benefit_b: PeakShaving
    type: E
    rationale: >-
      준중앙급전으로 등록하면 방전 시점을 계통운영자가 정하므로 사용자가 원하는
      시각에 방전할 수 없고 사용자의 전기사용량에 영향이 없다 — 자가 피크 저감이
      성립하지 않는다 (R48 판정 §2)
