# 편익 배타 규칙 — spec FR-402-AC2.A~.E · FR-402-AC4
#
# **이 파일이 정본이다.** 코드에 같은 표를 다시 두지 않는다 — FR-402-AC4 가
# 요구하는 «선언적 규칙 테이블» 이 그것이고, `if benefit_a == "REC" and ...`
# 로 짜면 제도 개정이 코드 배포를 요구한다.
#
# R15 가 요금표(`FR-501-AC4`)에서 같은 판단을 했다. 그때의 검증 방식이
# 여기에도 그대로 적용된다 — **로더가 있는지가 아니라, 같은 코드에 이 파일만
# 바꿔 결과가 달라지는지**를 고정한다.
#
# 유형 (spec FR-402-AC2):
#   A  동일 물리량 이중 판매        차단 100% (음성 검증)
#   B  인과 하류가 상류에 이미 포함  오탐 0 (양성 검증)
#   C  동일 효과의 이중 화폐화       오탐 0
#   D  제도적 배타                   오탐 0
#   E  동시에 성립할 수 없는 운전     차단 100% (음성 검증) — R52 판정 §3 전문
#
# `applies_to_profile` 을 비우면 «모든 규제 프로파일에 적용» 이다. 제도 한정
# 규칙만 프로파일 이름을 둔다 (FR-504).
#
# ── R56 신설 — **물리량 축** (유형 A·E 에만 걸린다) ─────────────────────
#
# 아래 행들은 **편익 태그 짝**을 적는다. 그런데 첫 행의 근거가 스스로 말하듯
# 조항이 금지하는 것은 *「**같은 1 kWh** 를 자가소비 절감과 잉여판매로 동시
# 계상」* 이지 「자가소비와 잉여판매를 함께 켜는 것」이 아니다. `FR-402-AC1`
# 은 한 걸음 더 나가 *「지불 주체가 다르거나 **물리량이 다르면 정상 계상한다**」*
# 를 **명시로 요구**한다.
#
# R55 까지 판정은 태그의 **집합**으로만 이뤄져서 그 물음을 던질 수단이
# 원리적으로 없었고, 그래서 물량이 다른 조합까지 거부했다 — **구현이 자기
# 규칙보다 엄격했다.** 이제 편익 인스턴스가 `ValueStream.quantity_id` 로
# 자기가 화폐화하는 물량을 말할 수 있다.
#
# **유형 `A`·`E` 짝을 만났을 때의 판정** (`collect_exclusions`):
#
#     둘 다 말하지 않았다      위반        ← 종전과 같다(기본값)
#     한쪽만 말했다            위반        ← 다르다는 것을 **증명할 수 없다**
#     둘 다 말했고 같다        위반        ← 조항 문면 그대로(같은 1 kWh)
#     둘 다 말했고 다르다      위반 아니다  ← R56 이 새로 만든 갈래
#
# ⚠⚠ **「한쪽만」을 통과시키지 않는 것이 요점이다.** 통과시키면 한 스트림에
# 표찰을 다는 것만으로 이 표 전체를 무력화할 수 있다 — 거부 기계에 우회로를
# 내는 것이다.
#
# ⚠ **유형 `B`~`D` 에는 걸리지 않는다.** 셋은 「같은 물리량」이 판정 근거가
# 아니다(`B` 인과 하류 · `C` 동일 효과의 이중 화폐화 · `D` 제도적 배타).
# 물량으로 걸러 내면 판정 근거가 아닌 것으로 규칙을 끄게 된다.
#
# ⚠ **스키마는 바뀌지 않았다.** 물량은 규칙이 아니라 **그 조합에 실제로 놓인
# 편익 인스턴스**가 지므로 행마다 필드를 더할 자리가 아니다. 그리고 **어느
# 배포 편익도 아직 물량을 선언하지 않는다** — 축만 세웠고 결론축은 그대로다.

version: 1

rules:
  - benefit_a: SelfConsumption
    benefit_b: SurplusSale
    type: A
    rationale: 같은 1 kWh 를 자가소비 절감과 잉여판매로 동시 계상할 수 없다

  - benefit_a: SurplusSale
    benefit_b: DirectTrade
    type: A
    rationale: 같은 잉여량을 상계거래와 직접거래로 동시 정산할 수 없다

  - benefit_a: DistributedBenefit
    benefit_b: SelfConsumption
    type: B
    rationale: >-
      송배전 회피·손실 감소는 현행 망이용요금에 반영 — 미래 증설 회피 증분만
      계상 (원칙 2-1)

  - benefit_a: REC
    benefit_b: SurplusSale
    type: D
    rationale: 상계거래 참여 설비의 REC 발급 제한 (제도 한정)
    applies_to_profile: net_metering

  # ── R31 신설 — **계약구조 축** (결정 §2-4) ─────────────────────────
  #
  # 바로 위 규칙은 `applies_to_profile: net_metering` 으로만 걸린다. 그런데
  # `ContractConfig.structure`(FR-205)와 `RegulationProfile`(FR-504)은 **완전히
  # 독립된 두 축**이므로, 사용자가 「상계거래」를 고르고도 다른 규제 프로파일을
  # 선택하면 **위 규칙이 조용히 걸리지 않는다** — 설계서가 지적한 REC 이중 계상
  # 위험이 정확히 그것이다.
  #
  # **구조 선택이 프로파일을 자동 강제하게 하지 않았다.** 두 축을 묶으면 새
  # 구조·새 프로파일 조합마다 매핑 코드를 고치게 된다. 대신 같은 금지를 **구조
  # 축으로 한 번 더** 선언한다 — 어느 프로파일을 골랐든 구조가 상계거래이면
  # 걸린다. 거부는 이미 실행 경로에 배선된 `assert_no_exclusions()` 가 담당한다.
  #
  # ⚠ **위 규칙과 쌍이 같으므로 이 표에 그대로 더할 수 없다** — 로더가 «이미
  # 선언된 쌍» 으로 막는다(양방향 대칭이라 한 번만 적는 규약). 그래서 상계
  # 구조에서 실제로 켜지는 편익 쌍으로 적는다: 상계는 `SurplusSale` 로 조립되고
  # (`core/valuestream/settlement.py`), REC 는 그 위에 얹히려 하는 쪽이다.
  # 유형은 위와 같은 **D(제도적 배타)** 다 — 물리량 이중이 아니라 제도가 금지한다.
  - benefit_a: REC
    benefit_b: DistributedBenefit
    type: D
    rationale: >-
      상계거래 구조에서는 REC 발급이 제한되므로, REC 를 켠 채 분산편익 크레딧까지
      계상하면 제도가 인정하지 않는 두 수익이 함께 잡힌다. **프로파일이 아니라
      구조로 걸린다** — 두 축이 독립이라 프로파일만으로는 조용히 통과한다
      (R31 결정 §2-4)
    applies_to_structure: 상계거래

  # ── R32 신설 — **집합 PPA 는 전량 판매다** ──────────────────────────
  #
  # `AggregatedPPA` 는 발전량 **전량**을 팔고, `SurplusSale` 은 계통 역송분(잉여)
  # 만 본다. 그러므로 PPA 를 켠 채 잉여판매를 켜면 이미 넘긴 kWh 를 한 번 더 파는
  # 것이고, 자가소비 절감을 켜면 넘긴 kWh 를 집에서 또 쓴 것으로 계상된다.
  #
  # ⚠ **둘을 다 적는 것이 요점이다.** 잉여판매만 막으면 **자가소비와 PPA 를 동시에
  # 켤 수 있고**, 그 조합의 결과는 아무 예외 없이 그럴듯하다 — 편익이 커진 쪽으로
  # 틀리므로 필요 지원 규모가 과소 산정된다(원칙 2-1 이 막으려는 방향).
  - benefit_a: AggregatedPPA
    benefit_b: SurplusSale
    type: A
    rationale: 집합 PPA 는 발전량 전량을 팔았으므로 같은 kWh 를 잉여로 다시 팔 수 없다

  - benefit_a: AggregatedPPA
    benefit_b: SelfConsumption
    type: A
    rationale: 집합 PPA 로 넘긴 kWh 는 자가소비가 아니다 — 동일 물리량 이중 계상

  # ── R48 신설 — **운전 주체 축** (판정 §2 · spec FR-402-AC2.E) ───────────
  #
  # 위 규칙들은 전부 **「계상해도 되는 편익 둘을 동시에 세면 안 된다」** 를 말한다.
  # R48 사용자 판정이 세운 축은 그것이 아니다 — **방전 시점을 누가 정하는가**가
  # 갈리므로 두 편익이 **애초에 같은 운전에 함께 존재할 수 없다.**
  #
  #     사용자 운전 : 방전 시점을 사업자가 정한다
  #                   → SelfConsumption · PeakShaving · TouArbitrage
  #     계통 급전   : 방전 시점을 계통운영자가 정한다 → NWAs · CP
  #
  # ⚠ **`TouArbitrage` 는 R50 이 더했다** — R48 이 이 블록을 적을 때 그 편익이
  # 저장소에 아직 없었다(`ESS.value_streams()` 가 `TOU_ARBITRAGE` 모드에서 빈
  # 튜플을 돌려주고 있었다). 그것도 **방전 시점을 사업자가 정하는** 편익이므로
  # 이 축의 사용자 운전 쪽에 선다 — 계통운영자가 방전 시각을 정하면 사업자는
  # 피크 시각을 골라 팔 수 없다.
  #
  # ⚠ **`applies_to_profile` 을 비운다** — 제도 한정이 아니다. 제도가 바뀌어도
  # 성립하지 않으므로 유형 `D` 가 아니고, 같은 kWh 를 두 번 파는 것이 아니므로
  # 유형 `A` 도 아니다. `E` 는 **「막는」 규칙이 아니라 「성립하지 않음을 선언」**
  # 하는 규칙이다 (spec FR-402-AC2.E 신설 사유).
  #
  # ⚠⚠ **「선언」이 「거부하지 않는다」는 뜻이 아니다 (R52/WP-3 오독 방지).**
  # 위 문장이 답하는 것은 *「왜 `A` 도 `D` 도 아닌가」*(판정 근거가 물리량
  # 이중도 제도 한정도 아니라 운전 주체 축이라는 것)이지 *「집행하지 않는다」*
  # 가 아니다. 조항 `FR-402-AC2.E` 는 다른 유형과 똑같이 **「선택 시 검증
  # 오류로 거부한다. 차단 100%」** 이며, 사용자 판정 §3 앞 문장(「배터리는
  # 한 번에 하나의 역할만 수행하는 것으로 설계해야 함」)이 그 집행을 요구한다
  # — `assert_no_exclusions()` 가 유형 `A` 와 함께 `E` 도 막는다.
  #
  # ⚠ **여섯을 다 적는다.** 계통 급전 편익 둘 × 사용자 운전 편익 셋 = 6쌍이며,
  # 하나라도 빠지면 그 조합만 조용히 열린 채 남는다 — R32 가 집합 PPA 에서
  # 「잉여판매만 막으면 자가소비와 동시에 켤 수 있다」로 밟은 자리와 같다.
  # (R48 은 사용자 운전 편익을 **둘**로 세어 「넷」이라 적었다. `TouArbitrage`
  # 가 서면서 **2 × 3 = 6** 이 됐고, 세는 문장을 고치지 않으면 다음 사람이
  # 「빠진 쌍이 없다」를 그 문장으로 판정한다.)
  - benefit_a: NWAs
    benefit_b: SelfConsumption
    type: E
    rationale: >-
      방전 시점을 계통운영자가 정하면 사용자가 원하는 시각에 방전할 수 없고
      사용자의 전기사용량에 영향이 없다 — 자가소비가 성립하지 않는다
      (R48 판정 §2)

  - benefit_a: NWAs
    benefit_b: PeakShaving
    type: E
    rationale: >-
      방전 시점을 계통운영자가 정하면 사용자가 원하는 시각에 방전할 수 없고
      사용자의 전기사용량에 영향이 없다 — 자가 피크 저감이 성립하지 않는다
      (R48 판정 §2)

  - benefit_a: CP
    benefit_b: SelfConsumption
    type: E
    rationale: >-
      준중앙급전으로 등록하면 방전 시점을 계통운영자가 정하므로 사용자가 원하는
      시각에 방전할 수 없고 사용자의 전기사용량에 영향이 없다 — 자가소비가
      성립하지 않는다 (R48 판정 §2)

  - benefit_a: CP
    benefit_b: PeakShaving
    type: E
    rationale: >-
      준중앙급전으로 등록하면 방전 시점을 계통운영자가 정하므로 사용자가 원하는
      시각에 방전할 수 없고 사용자의 전기사용량에 영향이 없다 — 자가 피크 저감이
      성립하지 않는다 (R48 판정 §2)

  # ── R50 신설 — **TOU 차익거래가 그 자리에 선다** (R48 판정 §4) ───────────
  #
  # R48 이 `TOU_ARBITRAGE` → `SelfConsumption` **오매핑을 뗐고 그 자리를 비워
  # 두었다.** `FR-401-AC2.TouArbitrage` 가 그 자리를 채우면서 규칙 셋이 함께
  # 섰다 — **당시 유형 A 하나 · 유형 E 둘**(R51/WP-5 가 유형 A 를 뗀 경위는
  # 바로 아래 블록).
  #
  # ⚠ **유형이 갈리는 지점을 헷갈리지 않는다.**
  #
  #     SurplusSale 과는 배타가 아니다(R51/WP-5 — 아래 블록 참조)
  #     NWAs·CP 와는 E     같은 운전에 **애초에 함께 존재할 수 없다**
  #
  # ⚠⚠ **`SelfConsumption`·`PeakShaving` 과는 배타를 적지 않는다.** 셋 다 운전
  # 주체가 사업자이고 `ESS.mode_weights` 가 혼합 모드를 **명시로 허용**한다
  # (`tests/der/test_ess.py` 가 `TOU_ARBITRAGE 0.5 + PEAK_SHAVING 0.2` 를 돌린다).
  # 배타로 적으면 **정당한 동시 계상을 지우며**, 그것은 `FR-402-AC1` 이 명시로
  # 금지한 방향이다 — 겁내서 하나만 세면 과대 지원을 요구하게 된다.
  #
  # ── R51/WP-5 가 위 「`TouArbitrage` ↔ `SurplusSale` 유형 A」 한 줄을 **뗀다**
  #    (사용자 판정 §4, `docs/decisions-2026-09-01-R51.md`) ─────────────────
  #
  # R50 이 유형 A 로 적은 근거는 *「TOU 차익거래는 계통으로 방전하고 잉여판매는
  # 시스템 총 역송량으로 계산되므로 같은 kWh 가 두 항목에 각각 판매로 들어간다」*
  # 였다 — **방향은 맞다.** 그런데 사용자 판정 §4 는 그것을 *「두 번 센 것」*이
  # 아니라 *「같은 전력이 길을 돌아간 것」*으로 다시 읽는다: ESS 의 충전원이
  # `PV_SURPLUS` 면 그 방전분은 **태양광 전력이 ESS 를 경유한 것**이라 태양광
  # 판매로 세는 것이 맞고(손실 제외), `GRID` 면 태양광과 무관하므로 세면 안
  # 된다. **답은 「둘 중 하나를 끄라」가 아니라 「잉여판매 수량에서 그 몫을
  # 빼라」다** — 배타로 막으면 `TouArbitrage` 와 `SurplusSale` 의 **정당한 동시
  # 운전**(예: ESS 는 `GRID` 충전으로 차익거래를 하고, PV 잉여는 따로 판매하는
  # 구성)을 지운다.
  #
  # 차감은 `core/valuestream/surplus_sale.py::SurplusSale.__init__` 의
  # `non_pv_ess_discharge_kwh` 인자가 지고, 러너(`core/casegrid/e2e_runner.py`)가
  # ESS 의 충전원이 `GRID` 일 때만 그 ESS 의 방전량을 계산해 넘긴다(`PV_SURPLUS`
  # 면 0.0). **그래서 이 쌍은 더는 배타가 아니다** — 수량 자체가 겹치지 않도록
  # 만들었으므로 둘을 동시에 켜도 이중 계상이 없다. 규칙 총수가 14 → 13,
  # 유형 A 가 5 → 4 로 준다(유형 E 는 6 그대로).
  - benefit_a: NWAs
    benefit_b: TouArbitrage
    type: E
    rationale: >-
      방전 시점을 계통운영자가 정하면 사업자가 피크 시각을 골라 팔 수 없다 —
      요금차 차익거래가 성립하지 않는다 (R48 판정 §2 의 운전 주체 축)

  - benefit_a: CP
    benefit_b: TouArbitrage
    type: E
    rationale: >-
      준중앙급전으로 등록하면 방전 시점을 계통운영자가 정하므로 사업자가 피크
      시각을 골라 팔 수 없다 — 요금차 차익거래가 성립하지 않는다
      (R48 판정 §2 의 운전 주체 축)
