# source-rules.lock
#
# 정본(定本) 규칙 문서의 판본 고정 파일.
# spec-분산특구-경제성평가.md §16.5.3 (정본 개정 감지) 의 산출물이며,
# Wave 0 산출물 0.7 에 해당한다.
#
# 왜 필요한가
#   본 spec의 요구사항 상당수가 볼트의 규칙 노트에서 파생된다. 그 노트는
#   spec과 별개로 개정되며, 개정 사실이 spec에 자동으로 전달되지 않는다.
#   2026-08-02 하루에만 정본이 세 번 바뀌었고 세 번 다 사람이 뒤늦게 발견했다
#   (신뢰도 어휘 미확인→가정, 부기 항목 6종→7종, 하위 절 번호 폐지).
#   날짜 해상도로는 같은 날 여러 번의 개정을 구분할 수 없으므로
#   sha256 과 초 단위 mtime 을 함께 고정한다.
#
# 대조 5종  (scripts/check_source_rules.py)
#   1) 정본 해시            — 정본 파일이 바뀌었는가
#   2) 저장소 사본 동일성   — docs/ 사본이 정본과 바이트 동일한가
#   3) 앵커 실재            — spec이 인용하는 좌표가 정본에 아직 있는가
#   4) spec↔lock 인용 정합  — 본문 인용과 아래 목록이 일치하는가 (원칙·제목 양방향)
#   5) 폐지 좌표 인용       — 정본이 폐기한 하위 절 번호를 쓰고 있지 않은가
#
#   해시가 같으면 3)은 자동으로 참이다. 해시가 다를 때 3)이 변경의 성격을
#   알려준다 — 앵커가 살아 있으면 문구 수정, 사라졌으면 구조 개편이다.
#
#   1)과 4)는 반대 방향이다. 1)은 정본이 움직인 것, 4)는 spec이 움직인 것.
#
# mtime·size_bytes 는 판본 식별 기록이며 **대조 대상이 아니다.**
#   판정 근거는 sha256 뿐이다. 다만 --update 는 셋을 함께 갱신한다 —
#   해시만 고치면 기록이 다른 판본을 가리키게 되어 없느니만 못해진다.
#
# 검사 범위 (§16.5.3 절차 2b)
#   spec 본문만 스캔한다. 변경 요약·정정 이력 블록은 제외한다.
#   그 블록들은 "무엇이 폐기되었는지"를 기록하는 곳이므로 폐기된 앵커를
#   인용하는 것이 정상이며, 포함하면 영구 오탐이 된다.
#
# 수동 검증 (CI 구축 전)
#   sha256sum -c <(awk '/sha256:/{h=$2} /path:/{p=$2} h&&p{gsub(/"/,"",p); print h"  "VAULT"/"p; h=p=""}' \
#                  VAULT="<정본 볼트>" source-rules.lock)
#
# 갱신 절차
#   해시 불일치 발견 → §16.5.1 파생 관계표를 따라 영향 FR 전수 재검토
#   → spec 개정 → 이 파일의 mtime·sha256·cited_anchors 갱신
#   → 저장소 사본(docs/domain-rules.md, docs/evidence-standard.md) 동기화
#   정본은 볼트에서만 개정한다. 사본을 고치면 정본이 둘이 된다.

version: 1
vault_root: ""       # 로컬 볼트 경로. 환경변수 DER_VAULT_ROOT 또는 --vault 로 지정한다
                     # (사람마다 다르고 저장소가 공개되므로 여기 박지 않는다)
locked_at: "2026-08-02T16:47:00+09:00"
locked_against_spec: "rslt/spec-분산특구-경제성평가.md v0.8"

sources:
  - path: "0. rules/분산자원 경제성 평가 원칙.md"
    wikilink: "[[분산자원 경제성 평가 원칙]]"
    repo_copy: "docs/domain-rules.md"
    mtime: "2026-08-02T16:25:17+09:00"
    size_bytes: 17446
    sha256: "045f5f99b8c2b4c391defc06441846faee5c575b05bd733272b82e481d676636"

    # 인용 좌표계: 원칙 번호 (§16.5.2 1순위)
    # 근거 — 2026-08-02 정정 이력이 하위 절 번호를 "2.1과 원칙 2-1이 서로
    # 다른 것을 가리켜 판정이 갈렸음"을 사유로 폐지했다. 같은 날 절 구조는
    # 두 번 바뀌었으나 원칙 번호 27개는 모든 판본에서 동일했다.
    cited_anchors:
      # 원칙 1-1(편익은 반사실 대비 증분)은 등재하지 않는다 — spec 본문이
      # 직접 인용하지 않기 때문이다. 최초 lock 작성 시 잘못 넣었던 것을
      # 대조 절차가 잡아냈다(§16.5.3 절차 2, spec↔lock 양방향 검사).
      # FR-705가 이 원칙을 인용하도록 spec을 고치면 그때 등재한다.
      - "원칙 1-2"   # 기준선 자체를 계산·표시      → FR-705, FR-607
      - "원칙 2-1"   # 증분만 계상                  → FR-402 유형 B
      - "원칙 2-2"   # 하나의 물리량, 하나의 가격   → FR-402 유형 C
      - "원칙 2-3"   # 관점 분리                    → FR-704, FR-611
      - "원칙 4-2"   # 항목별 상승률 분리           → FR-601 전기요금 인상률
      - "원칙 4-3"   # 수명주기 전체·잔존가치       → FR-104
      - "원칙 4-4"   # 성능 저하                    → FR-104
      - "원칙 5-1"   # 에너지 수지 균형             → NFR-102 (1e-6 kWh)
      - "원칙 5-3"   # 매체별 수지 분리             → FR-101, RC-HP-P3
      - "원칙 6-3"   # 가정 값의 영향도 보고        → FR-1002, UI-3
      - "원칙 7-1"   # 영향도 우선 보고             → FR-1002, SG-3
      # 원칙 7-2(인과 제시)는 등재하지 않는다 — spec 본문이 직접 인용하지
      # 않는다. FR-1001이 인과 제시 내용을 담고 있으나 원칙 번호로 인용하지는
      # 않는 상태다. 인용을 추가하면 그때 등재한다.
      - "원칙 7-5"   # 지표 선택·LCOE 단서          → FR-703, §16.5.2 3순위 예시

    # 원칙 번호가 없는 대상 — 제목 전문으로 인용한다 (§16.5.2 3순위).
    #
    # 취약 지점이다. 원칙 번호는 판본을 넘어 살아남는 것이 관측되었으나
    # 제목은 그렇지 않다. 정본이 제목만 다듬어도 이 인용은 깨진다.
    # 대조 절차가 spec↔lock 양방향으로 검사하지만(v0.6에서 추가), 그것은
    # 어긋남을 알려줄 뿐 취약성 자체를 없애지는 못한다.
    #
    # 정본에 원칙 번호가 부여되면 그때 1순위 좌표로 옮긴다.
    cited_headings:
      - "부록 A. 편익 항목 추가 시 실무 적용 절차"   # 4문항 판정 → FR-402
      - "핵심 규칙 세 가지"                          # 이전지출·관점 → FR-704, FR-404

