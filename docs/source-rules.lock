    # 인용 좌표계: 절 번호.
    # 이 문서는 원칙 번호 체계가 없어 절 번호가 유일한 좌표다.
    # 절 구조는 안정적이다 (16:15 정정 이력 = "정정 없음, 최초 작성 상태").
    #
    # spec은 "5절"로 인용하지만 정본의 실제 문자열은 "## 5. 수치·입력값…" 이다.
    # 대조는 정본 문자열로 해야 하므로 label/match 를 분리한다.
    # 제목 전문을 match 로 두면 절 번호 변경뿐 아니라 **제목 변경도** 잡힌다.
    cited_anchors:
      - label: "0절"   # 재정의 금지·정정 지점 단일화 → §16.5.2
        match: "## 0. 핵심 요약"
      - label: "2절"   # 신뢰도 3단계 확정/추정/가정  → FR-601, UI-3, AssumptionItem.confidence
        match: "## 2. 축 2 — 입력값 신뢰도"
      - label: "5절"   # 부기 항목 7종                → FR-601, FR-603, TechCatalog
        match: "## 5. 수치·입력값 필수 부기 항목"

# 파생 관계 상세는 spec §16.5.1 을 정본으로 한다.
# 이 파일에 적힌 FR 주석은 탐색 편의용 사본이며, 불일치 시 §16.5.1 이 우선한다.
