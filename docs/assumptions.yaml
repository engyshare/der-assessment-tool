    # 이 항목만은 그 한정을 잃으면 물가 상승률로 오독되어 이중 계상이 된다.
    value_unit: "%/년"
    base_year: "2026~2045 (20년 분석기간)"
    applicable_scope: >-
      **물가 상승분을 뺀 뒤 남는 추세**다 — 명목 상승률이 아니다. 명목
      교체단가의 연 변화율은 `물가 계수(2.0%/년) + 이 값` 이며, 지금 이 값이
      0 이므로 명목 변화율은 물가 계수와 같다.
      **분석기간 안에 교체가 일어나는 설비의 재취득 단가**에만 걸린다 —
      `ESS` 배터리·PCS, `PV` 인버터가 대상이고 최초 취득가(`capex.*`)에는
      걸리지 않는다. 고정·변동 O&M 도 대상이 아니다(그쪽은 설비 단가가 아니라
      운영비이며 물가 계수만 탄다).
    derivation_method: >-
      가정 — **0 을 「측정한 값」이 아니라 「고른 값」으로 적는다.** 교체비 산식은
      `취득단가 × 물가계수^(n-1)`(`core/casegrid/e2e_runner.py::
      PRICE_ESCALATION_RATE` = 2.0%/년)이므로 **실질 추세 항목이 없으면 0 을
      가정한 것과 같다.** R40 이 `ESS` 교체비에 그 계수를 배선하면서 이 침묵이
      결론에 들어왔고(무보조 순현재가치가 −222,794원 움직였다), 그래서 R41 이
      **값을 바꾸지 않고 가정을 대장으로 끌어올렸다.**
      ★ **3수준은 전망이 아니라 탐색 범위이며 물가 계수를 자로 삼는다.**
      하단 −2.0 은 실질 하락이 물가 상승과 **같은 크기**여서 **명목 교체단가가
      불변**이 되는 지점이고, 그것이 곧 **R40 이전 구현**이다 — 즉 하단을 흔들면
      *「물가 계수를 태우지 않았다면 얼마였는가」* 를 다시 잰다. 상단 +2.0 은 그
      거울상이며 원자재·인건비가 물가보다 빨리 오르는 경우를 가리킨다.
      **어느 끝도 관측이 아니다** — 관측이 오면 이 유도는 통째로 교체된다.
    source: null
    verified_at: null
    confidence: "가정"
    disclosure: "공개 가능"
    impact: "중간"
    impact_note: >-
      교체가 일어나는 해의 지출 크기를 정한다. **방향이 한쪽으로만 열려 있다** —
      배터리·인버터는 실질 단가가 내리는 것이 통상 관측이므로 0 은 교체비를
      **과대** 계상하는 쪽이고, 그러면 사업이 실제보다 나빠 보인다. 「보수적이라
      안전하다」로 읽지 말 것 — 근거 없이 한 방향을 고른 것이며, 이 저장소가
      `tests/casegrid/test_lifecycle_wiring.py` ⓒ 로 경계하는 형태다.
      ✔ **R42 가 스윕 축으로 배선했다** — 5.1 영향도 표에 **5위**로 선다
      (변동폭 712,020원). 하단 −2.0 에서 결손이 6,289,675 → **5,984,595원**
      이므로, **R40 이 교체비에 물가 계수를 태운 판정이 결론에 넣은 크기는
      305,080원**이다. 그 수가 이제 리포트에 있다.
      ⚠ **자원 계약이 계수를 둘로 갖는다** — 이 항목이 O&M 을 적용범위에서
      뺐으므로 `DER.replacement_escalation_factor()` 가 교체비 전용으로 따로
      있다. 한 계수로 두면 하단 −2.0 이 O&M 물가까지 꺼서 다른 것을 재게 된다.
    replace_when: >-
      `Q-2`(ESS·V2G·히트펌프 단가) 회신에 **교체 시점 단가**가 함께 오면 닫힌다 —
      같은 업계 견적에서 받을 수 있으므로 따로 요청하지 않는다. 배터리·인버터
      학습곡선 연구로 대체해도 되나 그때는 `confidence` 가 `추정`을 넘지 못한다.

  - q_ref: "Q-18"
    # ⚠ **접두사가 `capex.` 인 이유** — 붙임 6 이 대장을 접두사로 무리 짓는다
    # (`core/report/appendix_sections.py::TOPIC_PREFIXES`). 이 값은 요금이
    # 아니라 **설비 단가의 구성비**이므로 「설비 단가」 무리에 서야 한다.
    # `capex.pv.*` 를 쓴 것은 이것이 `capex.pv.rooftop` **하나를 쪼개는** 값이고
    # 그 사실이 키만 보아도 보여야 하기 때문이다.
    key: "capex.pv.inverter_share"
    title: "PV 설비단가 중 인버터 몫"
    track: "assume"
    value: 15.0
    sensitivity: { low: 10.0, base: 15.0, high: 20.0 }
    value_unit: "%"
    base_year: "2026 (전망)"
    applicable_scope: >-
      **`capex.pv.rooftop`(설치 완료 기준 단가)에 대한 비율**이다 — 금액이
      아니라 구성비이며, 인버터 단가는 `capex.pv.rooftop × 이 값` 으로 짓는다.
      걸리는 자리는 **인버터 재취득 단가 하나**다: 12년 수명이 끝난 뒤의 교체비
      (`PV.replacement_schedule()`)와 그 재취득분의 잔존가치
      (`PV._acquisitions()`)가 이 단가를 본다.
      ⚠ **최초 취득가를 쪼개는 데는 아직 쓰이지 않는다.** 최초 인버터 값은
      `capex.pv.rooftop` 안에 이미 들어 있고(「설치 완료 기준」), 그것을 떼어
      본체 잔존가치에서 빼는 일은 별개의 판단이라 여기서 하지 않았다 — 그
      어긋남은 `status.md` 「다음에 집을 것」 22번이 크기와 함께 들고 있다.
      벽면 BIPV(`capex.pv.bipv_wall`)에는 걸리지 않는다 — 구조가 다르고 구성비
      표본이 따로다.
    derivation_method: >-
      가정 — **15% 를 「측정한 값」이 아니라 「고른 값」으로 적는다.** 이 값은
      `core/der/pv.py::DEFAULT_INVERTER_CAPEX_RATIO = 0.15` 라는 **소스 상수**
      였고 어느 케이스 축에도 없었다. R39-E 가 교체비·잔존가치를 배선하면서
      **처음으로 결론에 들어왔는데**(순 −389,048원) 흔들어 볼 수 없었으므로
      *「0.15 를 골랐다」가 결론에 얼마를 넣었는지* 검토자가 알 수 없었다.
      `NFR-202` 검사(`scripts/check_hardcoded_params.py`)는 판정이
      `|값| ≥ 1,000` 이라 이 리터럴을 보지 못한다 — `tariff.surplus_direct_sale`
      의 `120.0` 과 **같은 형태의 사각지대**이며 그때도 검사가 아니라 사람이
      찾았다. **값을 바꾸지 않고 가정을 대장으로 끌어올린 것이 전부다.**
      ★ **3수준은 전망이 아니라 탐색 범위이며, 자는 그 상수가 스스로 적어 둔
      「통상 10~20% 구간」이다** — base 15.0 은 그 구간의 중앙이고 상수의 값
      그대로다. **어느 끝도 관측이 아니다** — 견적 내역이 오면 이 유도는 통째로
      교체된다.
    source: null
    verified_at: null
    confidence: "가정"
    disclosure: "공개 가능"
    impact: "낮음"
    impact_note: >-
      **인버터 재취득 단가 하나를 정한다** — 13년차 교체비와 그 재취득분의
      20년차 잔존가치가 함께 움직인다. 초기 총사업비는 **움직이지 않는다**
      (설치 완료 기준 단가가 최초 인버터를 이미 품고 있다).
      ★ **방향을 재서 적는다 — 몫을 크게 잡을수록 결론이 나빠진다.**
      3kW 기준 10 → 20% 에서 13년차 교체비는 608,756 → 1,217,512원(+608,756)
      인데 20년차 잔존가치는 1,162,919 → 1,365,837원(+202,918)에 그치고,
      그나마 7년 더 할인된다. **잔존가치가 교체비를 상쇄하지 못한다.**
      ⚠ **「크게 잡는 쪽이 보수적이라 안전하다」로 읽지 말 것** — 15% 는
      상수가 적어 둔 10~20% 구간의 **중앙**이며 어느 방향으로도 치우치지
      않았다. 치우침이 있다면 그것은 이 항목이 아니라 **최초 인버터 몫이
      본체 잔존가치에 그대로 남아 있다**는 별개의 어긋남 쪽이다
      (`status.md` 「다음에 집을 것」 22번).
      ✔ **R43 이 대장 항목을 세우고 같은 라운드에 스윕 축으로 배선했다** —
      5.1 영향도 표에 **6위**로 선다(변동폭 **259,364원** · 검토 범위
      10~20%). 결손은 하단 10% 에서 6,159,992원, 상단 20% 에서 6,419,356원
      이며 **기준수준 −6,289,675원은 움직이지 않았다**(대장 base 15.0 이
      옛 소스 상수 0.15 와 같은 값이다). **결론은 어느 끝에서도 뒤집히지
      않는다.**
    replace_when: >-
      `Q-1`(옥상 PV 단가)과 **같은 업계 견적의 내역**에서 받는다 — 총단가만
      오면 닫히지 않으므로 「인버터 단가를 따로 적어 달라」를 함께 요청한다.
      공공 보급사업 단가표가 품목별 내역을 공표하면 그것으로도 닫힌다.
