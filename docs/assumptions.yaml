notes:
  - subject: "왜 가정값에도 sensitivity 를 요구하는가"
    text: >-
      단일 값만 두면 그 값이 맞다는 인상을 준다. 범위를 함께 두면 결과가
      범위 안에서 얼마나 흔들리는지가 같이 나오고, 흔들림이 결론을 바꾸는
      항목이 무엇인지 드러난다(FR-1002 영향도 순위). 회신을 어느 항목부터
      받아야 하는지도 그 순위가 답한다 — 16.6 현황판이 이 순위를 본다.

  - subject: "가정값이 코드에 스며드는 것을 무엇이 막는가"
    text: >-
      NFR-202(수치 리터럴 스캔 lint)와 2.9 작업이 막는다. 이 파일의 값은
      AssumptionSet 씨앗으로 로드되어야 하며, 소스에 리터럴로 적히면
      lint가 잡는다. 그것이 "나중에 변경 가능"의 기계적 보증이다.

  - subject: "이 대장과 spec §15.1의 관계"
    text: >-
      §15.1은 **무엇을 확보해야 하는가**의 정본이고, 이 파일은 **확보 전까지
      무엇으로 대신하는가**의 정본이다. Q 목록 자체를 여기서 늘리거나 줄이지
      않는다 — scripts/check_assumptions.py 가 양쪽 Q 목록을 대조한다.
