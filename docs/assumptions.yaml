      결론축은 그대로다, 아래 참조) — 검토 범위 50,000~150,000원/년에서
      변동폭 **1,535,451원**, 5.1 영향도 표 **6위**(12축 중). `opex.ess.
      fixed_om` 과 **값·폭이 같지만 독립 축이다**(각 1,535,451원 · 6·7위,
      실측 동일): PV·ESS 는 다른 설비이고 유지관리비가 갈릴 수 있다
      (사용자 판정 §2 의 ⚠ 주석은 「대장에 오르면 축이 하나 는다」고 적은
      뒤 **곧바로** 「둘을 합치면」이라 적어 하나로 셀 수도 있게 읽히지만,
      이 WP 는 「다른 설비」라는 더 앞선 근거를 따라 둘로 갈랐다 — 합치면
      3,070,902원으로 사용자 판정 §2 의 사전 추산(3,070,898원)과 거의
      같다. 오케스트레이터가 다시 볼 판단).
      ★ **WP-2 시점의 결론축(무보조 `npv`)은 −12,956,180원으로 그대로였다**
      — `base` 를 흔들지 않았으므로(사용자 판정 §2 *「현재 설정된 값을
      사용하되」*) 당연한 결과이나, 재어서 확인했다.
      ⚠ **그 결론축은 뒤에 움직였다** — R51/WP-6 이 사용자 판정 §1 에 따라
      낮 전기 배분 기본값을 「집 우선」으로 뒤집어 **−12,591,162원**이 됐다.
      ★ **이 항목의 변동폭은 그 이동에 영향받지 않았다** — 재어서 확인했다:
      **1,535,451원 그대로**(고정 O&M 은 운전과 무관한 연 정액이다). 바뀐
      것은 **순위**뿐이며, 붙임 2 에서 `pv_fixed_om` **4위** ·
