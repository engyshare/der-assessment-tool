# assumptions.yaml — 잠정 가정 대장 (Q-1~Q-13)
#
# spec §15.1이 "확보해야 한다"고 적은 외부 입력 13건을, 회신을 기다리지 않고
# **가정값으로 채워 개발을 진행**하기 위한 대장이다. 동시에 16.6 확보 현황판을
# 겸한다 — 무엇이 가정이고 무엇이 실측이며 언제 교체되는지가 한 파일에 있다.
#
# 왜 가정값으로 진행하는가
#   외부 회신 리드타임은 개발과 무관하게 흐른다. 기다리면 코드가 멈추고,
#   기다리지 않으면 근거 없는 수치가 코드에 박힌다. 셋째 길은 **가정을
#   가정이라고 표시한 채 데이터로 두는 것**이며, spec은 이미 그 구조를 갖고 있다
#   (FR-601 AssumptionSet · 부기 7종 · 신뢰도 3단계).
#
#   이 파일은 그 구조에 넣을 **씨앗 값**이고, 회신이 오면 값과 부기만 바꾼다.
#   코드는 바뀌지 않는다 — 그것이 "나중에 변경 가능하도록"의 실질이다.
#
# 세 갈래로 나뉜다 — track 필드
#
#   assume    가정값으로 진행한다. 계산 입력이며 틀려도 민감도로 드러난다.
#             sensitivity 범위를 반드시 갖는다 (FR-801 케이스 그리드의 탐색 축).
#
#   default0  제도 근거가 확인되지 않았으므로 **기본 비활성(값 0)** 으로 둔다.
#             크기를 추정하지 않는다 — 제도가 없으면 편익은 작은 게 아니라 0이다.
#             spec §15.1 Q-8 격상 사유와 FR-404가 이미 정한 원칙이다.
#
#   blocked   **가정하면 안 된다.** 검증의 정박점이므로 가정값을 넣는 순간
#             그 검증이 자기충족이 된다 — 우리가 만든 수치로 우리 계산을
#             검증하게 된다. 값 자리를 비워 두고 해당 판정을 유예한다.
#             scripts/check_assumptions.py 가 이 칸에 값이 들어가는 것을 막는다.
#
# 왜 blocked 갈래를 따로 두는가 — 이것이 이 파일의 핵심이다
#   Q-4(선행 실증의 원 계산 가정)는 17.4 SG-4(±15% 재현) 판정의 유일한
#   정박점이고, Q-5(현행 엑셀)는 §13.3 1차 대조군이다. 이 둘을 가정으로
#   채우면 "우리가 가정한 값을 우리 코드가 재현했다"가 되어 §13.0.2가 금지한
#   자기충족 테스트와 정확히 같아진다. **틀린 값을 넣는 것보다 나쁘다** —
#   틀린 값은 회신이 오면 드러나지만, 자기충족 검증은 초록불로 남는다.
#
# 부기 7종 (근거 표기 기준 5절 = spec FR-601-AC5.*)
#   value_unit / base_year / applicable_scope / derivation_method /
#   source / verified_at / confidence
#   가정 항목이라고 부기를 생략하지 않는다. **무엇을 근거로 가정했는지가
#   부기의 내용이 된다.** derivation_method 가 비면 검사기가 잡는다.
#
# 신뢰도 (근거 표기 기준 2절 — 축 2)
#   확정 / 추정 / 가정.  이 파일의 값은 개발 착수 시점에 전건 `가정`이다.
#   회신이 오면 `확정` 또는 `추정`으로 올리고 source·verified_at 을 채운다.
#   `확정`을 주장하면서 source 가 비면 검사기가 결함으로 보고한다.
#
# 교체 절차
#   1. 회신·자료 입수
#   2. 이 파일의 value·sensitivity·부기 7종을 갱신하고 confidence 를 올린다
#   3. python scripts/check_assumptions.py 통과 확인
#   4. 영향도 상위 5위 내 항목이 바뀌었으면 골든 시나리오 기준값을 재산출한다
#      (16.4). 그 전에는 회귀 실패가 정상이다 — 기준값이 옛 가정에 묶여 있다
#
# 이 파일은 코드가 아니라 데이터다. 수치를 코드에 옮겨 적지 않는다 (NFR-202).

version: 1
updated: "2026-08-08"
spec_section: "§15.1"

# ─────────────────────────────────────────────────────────────────────
# 갈래 A — 가정값으로 진행 (계산 입력)
