      수 있다」* 로 **판매**를 조건으로 적는다).
      ⚠ **단위가 `원/REC` 가 아니라 `원/kWh` 다** — REC 는 통상 1매 =
      1MWh 로 거래되므로 `원/REC` 로 확보한 값은 **1,000 으로 나누어**
      등재해야 한다. 조항이 그 환산을 예시에 적어 두었다
      (`FR-401-AC2.REC` — *「REC단가(70,000 원/REC ÷ 1,000)」*).
    derivation_method: >-
