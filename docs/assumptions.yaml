    applicable_scope: "주택용 3~10kW급 옥상 고정형. 대규모 발전사업용 단가와 다르다"
    derivation_method: >-
      가정. 공공 보급사업 주택용 단가가 최근 수년간 kW당 150만원대에서
      완만히 하락해 온 추세를 2026년으로 연장한 값이다. 실측이 아니며
      견적 표본도 없다. ±20%는 FR-801 결합 집합(설비단가·시공비)의
      기본 3수준과 같은 폭으로 잡았다 — 별도 폭을 쓰면 케이스 그리드와
      민감도 해석이 어긋난다.

      ★ **2026-09-02 R52/WP-5·6 재조사** — 서로 다른 블로그 3건이 130만~
      180만원/kW(중앙 155만~165만원)로 상호 수렴하고, 대장 값 160만원은
      그 범위 안(또는 언저리)이다 — 차이 약 +3~+6%로 작다. **합리적으로
      판정하고 값은 유지한다.** 1차 출처(고시 원문)는 확보하지 못했다 —
      한국에너지공단 공고 첨부(.hwp)가 이 조사 도구로 열리지 않았다. 그래서
      `confidence` 는 「다」등급(블로그 상호 수렴)에 머물고 올리지 않는다.
      민감도 폭도 조사 범위가 현재 폭(128만~192만) 안에 들어 유지한다
      (`docs/research-2026-09-02-R52-전제값.md` §1).
    source: >-
