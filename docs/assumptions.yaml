    impact_note: >-
      **금액은 크지만 관점에 따라 상쇄된다.** 사업자 관점에서는 매입세액
      공제로 회수되므로 순현금흐름 영향이 작고, 사회 관점에서는 이전지출로
      제외된다. 그럼에도 분리 계상이 필요한 이유는 «어느 관점에서 얼마가
      상쇄되는가»를 리포트가 보여야 하기 때문이다.
    replace_when: >-
      부가가치세법 세율 개정 시. 또는 분산에너지 특구에 영세율·면세 특례가
      도입되어 설비 유형별로 갈리게 될 때 — 그때는 단일 값이 아니라 유형별
      표가 필요하므로 이 항목을 표로 승격한다.

  # ───────────────────────────────────────────────────────────────────
  # 08-09 추가 — **점검이 대장의 결손을 잡았다.**
  #
  # WP-3(요금 엔진)이 `tariff.power_fund_rate` 키로 대장을 조회하도록
  # 구현했는데 **그 키가 대장에 없었다.** 점검 에이전트가 «정책 수치가
  # 대장에 없어 테스트 스텁의 리터럴로만 존재한다» 로 지적했다.
  #
  # `vat_rate` 때와 같은 유형이다 — 08-08에 NFR-202 검사가 히트펌프의
  # `vat_rate=0.1` 을 찾았고 **대장에 올릴 자리가 없어 그 값이 소스에 남아
  # 있었다.** 자리가 없으면 만들지 않는 쪽이 더 흔하다.
  #
  # 다만 이번에는 구현이 옳았다 — 소스는 키만 들고 값을 조회하며, 대장에
  # 없으면 `MissingAssumption` 으로 **멈춘다**(계약 v1.2 ⑦). 결손이 조용히
  # 0으로 메워지지 않았다는 뜻이고, 그것이 그 계약을 둔 이유다.
  # ───────────────────────────────────────────────────────────────────

  - key: "tariff.power_fund_rate"
    title: "전력산업기반기금 부담금률"
    track: "fixed"
    value: 0.027
    sensitivity: null
    value_unit: "소수 (0~1). 0.027 = 2.7%"
    base_year: "2026"
    applicable_scope: >-
      전기요금 청구서의 전력산업기반기금 부담금. 전기요금(기본요금 +
      전력량요금 + 각종 할인·할증 반영 후 소계)에 부과하며 **부가가치세와
      과세표준이 다르다** — 두 항목을 하나로 묶으면 청구서와 맞지 않는다
      (`FR-501-AC7` 이 둘을 함께 열거하면서도 별개 항목으로 두는 이유).
      직접거래분에도 부과되는지는 약관 확인 대상이다 (아래 replace_when).
    derivation_method: >-
      **가정이 아니다.** 전기사업법 제51조와 시행령이 정한 법정 부담금률이며
      현행 요율은 전기요금의 **2.7%** 다. 민감도 3수준을 두지 않는 이유는
      `tax.vat_rate` 와 같다 — 정해진 값에 범위를 주면 «정해졌다»와 «범위가
      있다»가 한 항목에 공존한다.

      **그러나 `vat_rate` 와 결정적으로 다른 점이 있다.** 부가가치세율 10%는
      1977년 도입 이래 변한 적이 없으나 **이 부담금률은 실제로 바뀌었다**
      (3.7% → 2.7%). 2026-08-09에 초판을 3.7%로 등재했다가 그날 정정한 것이
      그 증거다. 같은 `track: fixed` 라도 **「법이 정했다」가 「바뀌지 않는다」를
      뜻하지 않는다** — 그래서 값이 소스가 아니라 여기 있어야 한다.
    source: "전기사업법 제51조 (전력산업기반기금의 조성) 및 같은 법 시행령"
    verified_at: "2026-08-09"
    confidence: "확정"
    usage_terms: >-
      **법령 조문이다 — 저작권법 제7조 제1호에 따라 보호받지 못하는
      저작물이므로 이용조건 제약이 없다.** 재배포·인용·2차 가공이
      모두 자유롭고 출처 표기 의무도 법적으로는 없다(다만 이 대장은
      부기 7종의 `source` 로 표기한다 — 근거를 되짚을 수 있어야
      하기 때문이지 의무 때문이 아니다).

      **이 칸이 「없음」이 아니라 「제약 없음」이라고 적혀 있어야
      하는 이유**: 빈 칸은 «이용조건이 없다» 인지 «확인하지 않았다»
      인지 구별되지 않는다. 다음에 업계 견적이나 유료 DB 수치가
      들어오면 그때는 재배포 금지·출처 표기 의무가 실제로 붙고,
      빈 칸으로 두는 관행이 있으면 그것도 빈 칸으로 들어온다 (SC-7).
    disclosure: "공개 가능"
    impact: "낮음"
    impact_note: >-
      요금의 2.7%이므로 절대액은 작으나 **자가소비 편익이 「기존요금 −
      신규요금」의 차액**이라 요금 구성에서 빠지면 편익이 그만큼 과소
      계상된다. 20년 누계에서는 무시할 수 없다.
    replace_when: >-
      **부담금률 고시 개정 시 — 그리고 그것은 실제로 일어난다.** 3.7% → 2.7%
      개정이 이미 있었고, 개정 시 고쳐야 할 곳은 **이 파일의 `value` 한 줄
      뿐이다.** 소스·테스트·프로포마 어디에도 요율이 복제되어 있으면 안 된다
      — 복제되어 있으면 이 한 줄을 고쳐도 계산은 옛 요율로 돈다.

      또는 **분산에너지 특구 직접거래분의 부과 여부가 약관으로 확인될 때** —
      부과되지 않는다면 이 값이 아니라 «적용 대상»이 바뀌는 것이므로 항목을
      요금제별로 쪼갠다.

# ─────────────────────────────────────────────────────────────────────
# 값을 갖지 않는 판단 — 참고용. 검사 대상이 아니다
# ─────────────────────────────────────────────────────────────────────

notes:
  - subject: "왜 가정값에도 sensitivity 를 요구하는가"
    text: >-
      단일 값만 두면 그 값이 맞다는 인상을 준다. 범위를 함께 두면 결과가
      범위 안에서 얼마나 흔들리는지가 같이 나오고, 흔들림이 결론을 바꾸는
      항목이 무엇인지 드러난다(FR-1002 영향도 순위). 회신을 어느 항목부터
      받아야 하는지도 그 순위가 답한다 — 16.6 현황판이 이 순위를 본다.

  - subject: "가정값이 코드에 스며드는 것을 무엇이 막는가"
    text: >-
      NFR-202(수치 리터럴 스캔 lint)와 2.9 작업이 막는다. 이 파일의 값은
      AssumptionSet 씨앗으로 로드되어야 하며, 소스에 리터럴로 적히면
      lint가 잡는다. 그것이 "나중에 변경 가능"의 기계적 보증이다.

  - subject: "이 대장과 spec §15.1의 관계"
    text: >-
      §15.1은 **무엇을 확보해야 하는가**의 정본이고, 이 파일은 **확보 전까지
      무엇으로 대신하는가**의 정본이다. Q 목록 자체를 여기서 늘리거나 줄이지
      않는다 — scripts/check_assumptions.py 가 양쪽 Q 목록을 대조한다.
