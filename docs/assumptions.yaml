      아직 변동 O&M 을 배선하지 않았다(`status.md` 착수 순서 23번).
    derivation_method: >-
      가정. 소스 상수 `PV_FIXED_OM_WON_PER_YEAR = 100_000` 을 값 그대로
      옮긴다 — 사용자 판정 §2 *「현재 설정된 값을 사용하되」*.
      **±50% 라는 감도 폭 자체가 근거 없는 가정이다.** 유지관리 실적·
      견적이 전혀 없어 100,000원/년이 맞는지조차 모르는 상태이므로,
      비대칭 폭을 주면 「어느 방향이 더 그럴듯하다」는 근거 없는 주장이
      된다. 대칭 ±50% 는 그 「모른다」는 상태를 폭으로 그대로 옮긴 것이지
      유지관리비가 실제로 그 범위에서 움직인다는 관측이 아니다.
