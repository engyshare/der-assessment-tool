#   회신이 오면 해당 항목의 value·sensitivity·부기 7종을 갱신하고
#   confidence 를 올린 뒤 scripts/check_assumptions.py 를 다시 돌린다.
#   Q-4·Q-5 는 회신이 도착해야만 track: blocked 를 벗을 수 있다.
requests_sent: "2026-08-08"

# ─────────────────────────────────────────────────────────────────────
# 갈래 A — 가정값으로 진행 (계산 입력)
# ─────────────────────────────────────────────────────────────────────

# ── SC-8 민감도 등급 (08-08 신설) ────────────────────────────────────
#
# **등급 미지정은 「비공개」다** — SC-8 이 정한 안전한 기본값이다. 그러므로
# 값을 가진 항목은 **명시적으로** `공개 가능` 이어야 하고, 적지 않은 것은
# 통과가 아니라 결함이다(`check_assumptions.py` 가 막는다).
#
# **08-08 이전에는 이 필드가 아예 없었다.** 조항대로 읽으면 등재된 20건 전부가
# 비공개인 채로 공개 저장소에 있었던 셈이다. 실제 내용은 전부 공개 가능한
# 값이었지만 그 사실이 어디에도 적혀 있지 않았고, **그 상태로는 다음에 진짜
# 업계 견적이 들어와도 아무것도 달라지지 않는다.**
#
# 지금 18건이 `공개 가능` 인 근거 —
#   · 가정 13건  공개된 단가 추세를 연장한 **내 추정**이다. 업계 견적도
#                미공표 제도 검토도 아니며, FR-1101-AC3 이 말하는 «합성 예시
#                전제»가 정확히 이것이다
#   · 비활성 4건 값이 0이다. 숨길 것이 없다
#   · 확정 1건   법정 세율이고 출처가 공개되어 있다
#
# **가정 불가 2건에는 등급을 달지 않았다.** 값이 없으므로 새어 나갈 것이
# 없고, 값이 도착하는 시점이 등급을 정할 시점이다 — 지금 미리 `공개 가능` 을
# 달아 두면 **회신으로 받은 업계 수치가 이미 공개 등급을 달고 들어온다.**

