      70원으로 설정해줘. 추후 변경될 수 있으니 설정을 변경할 수 있게
      설계」*(`docs/decisions-2026-09-02-R52.md` §5). 값은 사용자 지시가
      정했으며, `track` 을 `default0`(값 0)에서 `assume`으로 옮긴다 — 값
      70 과 「기본 비활성」은 함께 둘 수 없다.

      ★ **2026-09-02 R52/WP-5·6 재조사가 이 값을 뒷받침한다** — 전력거래소
      (KPX) 「오늘의 REC」(2026-09-01, 평균 70,648원/REC)와 haezoom 8월
      집계(육지 평균 70,878원/REC) 두 독립 출처가 70,500~71,000원/REC 대에서
      일치하고, 1REC=1MWh 환산 시 70.5~71.0원/kWh 다. 사용자가 지정한 70원은
      이 실제 시세와 **+0.7~1.4% 로 거의 정확히 일치한다** — 조항 예시
      (70,000원/REC ÷ 1,000)에서 빌린 값이 우연히 현재 시세와도 맞는다.

      **민감도 3수준의 폭** — 조사(§6)가 준 재료 둘 중 「연간 추세 변동」을
      축으로 골랐다(일간 변동 ±0.4% 는 20년 분석의 폭으로 쓰기엔 너무
      좁다). 2021년 평균 35,356원/REC → 2022년 평균 56,831원/REC 로
