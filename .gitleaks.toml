# gitleaks 설정 — SC-5 비밀 문자열 스캔 (작업 2.3)
#
# **08-08 에 `secrets` 잡을 세웠으나 그 잡은 한 번도 통과한 적이 없다.**
# 2.3 은 「완료」로 기록되어 있었고 CI 에는 빨간불이 상주했다 — 이 저장소가
# 반복해서 만난 «검사가 있다고 적혀 있는데 실제로는 서 있지 않은» 상태의
# 또 다른 형태다. 다만 방향이 반대다: 조용한 초록불이 아니라 **읽히지 않는
# 빨간불**이었고, 읽히지 않는 경보는 없는 것과 같다.
#
# 원인 — 오탐 8건. 전부 `docs/assumptions.yaml` 의 대장 항목이다.
#
#     - key: "capex.pv.rooftop"
#     - key: "tariff.power_fund_rate"
#
# `generic-api-key` 규칙이 `key: "…"` 형태를 비밀로 본다. YAML 필드 이름이
# 하필 `key` 인 것이며, 그 이름은 대장 스키마가 정한 것이라 바꾸는 것은
# **검사를 통과시키려고 정본을 고치는 일**이다.
#
# ── 두 번 잘못 고쳤고 음성 확인이 그것을 잡았다 ────────────────────────
#
# 첫 시도는 `[[rules]] id = "generic-api-key"` 에 allowlist 를 달았다.
# gitleaks 에서 같은 `id` 로 규칙을 다시 선언하면 **기존 규칙을 대체**하며,
# 정규식을 함께 주지 않았으므로 **그 규칙의 탐지 능력이 통째로 사라졌다.**
# 오탐 8건은 없어졌고 CI 는 초록불이 됐을 것이다 — **가짜 키를 심어 보지
# 않았다면 그 상태로 넘어갔다.**
#
# 이것이 §13.0.1 ④ 가 말하는 그 간극이다. 「검사가 통과했다」와 「검사가
# 무언가를 검사했다」는 다르고, **면제를 잘못 넓히면 통과가 무의미해진다.**
#
# ── 지금 방식: 규칙을 건드리지 않고 **값의 모양**으로 가른다 ────────────
#
# 대장 키는 점으로 이은 소문자 식별자다(`capex.pv.rooftop`). 실제 API 키·
# 토큰은 이렇게 생기지 않는다 — 길고, 대소문자·숫자가 섞이고, 점 구분
# 계층 구조를 갖지 않는다. 전역 허용목록에 **그 모양만** 넣으므로
# 규칙 자체는 그대로 살아 있고, 대장에 진짜 키가 들어오면 걸린다.
#
# **파일 면제로 풀지 않은 이유**: `docs/assumptions.yaml` 을 통째로 면제하면
# 거기 진짜 API 키가 들어와도 보이지 않는다. 회신으로 받은 유료 DB 접근
# 정보가 대장에 섞여 들어오는 것은 충분히 있을 수 있고, 그때 이 검사가
# 유일한 방어선이다. 08-08 에 `SC-3` 탐지기를 고칠 때와 같은 판단 —
# **면제를 넓히지 않고 대상을 바꾼다.**

title = "der-evaluator"

[extend]
useDefault = true

[allowlist]
description = "전제 대장의 항목 키 — 점으로 이은 소문자 식별자"
# `^…$` 로 **전체 일치**를 요구한다. 부분 일치를 허용하면 진짜 키가 이런
# 조각을 품고 있을 때 함께 빠져나간다.
regexTarget = "match"
regexes = ['''^\s*-?\s*key:\s*"[a-z][a-z0-9_]*(\.[a-z0-9_]+)+"\s*$''']
