# disclosure: "공개 가능"
#
# **합성 예시 시드다 — 실제 업무 데이터가 아니다** (`FR-1101-AC3`).
# 공개 저장소에 있어야 하는 파일이며, 비공개 시드 경로 검사는 이
# 선언을 보고 통과시킨다. **선언이 없으면 비공개로 간주된다** —
# `SC-8` 이 민감도 등급에 쓰는 것과 같은 안전한 기본값이고,
# 잊은 것과 공개하기로 한 것을 구분하기 위해서다.
#
# 실제 값이 여기 들어오면 이 선언이 거짓이 된다. 그때는 파일을
# 비공개 저장소로 옮기고 이 파일에는 «구조»만 남긴다.
version: "0.1"
assumptions:
  - key: "capex.pv"
    value: 1200000
    value_unit: "원/kW"
    confidence: "가정"
  - key: "capex.ess"
    value: 600000
    value_unit: "원/kWh"
    confidence: "가정"
