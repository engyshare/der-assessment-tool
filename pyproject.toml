[project]
name = "der-evaluator"
version = "0.1.0"
description = "분산특구 사업모델 경제성 평가 프로그램"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.7",
    "pytest>=9.1.1",
    "pyyaml>=6.0",
    "reportlab>=5.0.0",
]

[project.optional-dependencies]
# 구획별 그룹 (§16.4 — `pyproject.toml` 은 WP-15 단독 소유, append-only).
# **구획이 직접 추가하지 않는다.** 여러 구획이 같은 파일을 동시에 편집하면
# 그 순간 §16.1 W-1(파일 단위 배타 소유)이 선언만 남는다. 의존성이 필요하면
# 요청하고, WP-15 가 여기에 append 한다.
persistence = [          # WP-13 (작업 3.0)
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pyarrow>=16.0",
]
api = [                  # WP-11 (작업 14.0)
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",       # 테스트 클라이언트
    # NFR-401-AC1 · SC-1 — 조항은 Argon2id 또는 bcrypt(cost≥12) 를 허용한다.
    # **Argon2id 를 쓴다.** 조항이 그것을 먼저 열거하고, 비밀번호 해싱에서
    # 메모리 하드 함수가 GPU 대량 시도에 더 강하다. 다만 **선택 자체를
    # 소스에 숨기지 않는다** — 어느 쪽을 썼는지는 검증 케이스가 말해야 한다.
    "argon2-cffi>=23.1",
    # UI-1-AC1 · FR-201-AC1 · FR-504-AC3 — 화면 라우터(`app/routers/ui.py`)가
    # `web.render` 를 모듈 수준에서 import 하고, 라우터 자동 수집이 그것을 앱
    # 기동 시점에 끌어온다. **여기 없으면 `pip install -e ".[api]"` 만 한 배포
    # 환경에서 앱이 기동하지 않는다.** 지금까지 도는 것은 `dev` 그룹의
    # `diff-cover` 가 끌어온 전이 의존이었고, 그것은 배포에 깔리지 않는다.
    "jinja2>=3.1",
    # FR-201-AC1 · FR-504-AC3 — 화면의 폼이 `application/x-www-form-urlencoded`
    # 로 제출하고, 그것을 받는 `app/routers/ui_forms.py` 가 `Form(...)` 을 쓴다.
    # **`python-multipart` 가 없으면 FastAPI 는 그 라우트를 세우다가 기동 시점에
    # 죽는다** — 화면이 안 뜨는 것이 아니라 앱 전체가 뜨지 않는다.
    # 하한은 실측한 `0.0.27` 보다 낮은 `0.0.9` 로 잡는다 — 그 판부터
    # `Form(...)` 이 요구하는 `multipart` 모듈 이름이 지금과 같다.
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "import-linter>=2.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # NFR-105 게이트 ① 변경분 커버리지 (작업 2.5)
    "diff-cover>=9.0",
    "pip-audit>=2.7.3",
]
e2e = [                  # R62/WP-4 (작업 15.12 E2E · 15.10 axe 접근성 스캔)
    # ⚠⚠ **이 그룹은 본 `tests` 잡에도 깔린다.** CI 의 「의존성」 단계가
    # optional-dependency 그룹을 읽어 전부 설치하기 때문이다(그것이 그 단계의
    # 요점이다 — 손으로 나열하면 조용히 빠진다). 그런데 본 잡은
    # `playwright install chromium` 을 돌리지 않으므로 **브라우저가 없다.**
    # 그래서 이 그룹을 쓰는 검사는 `tests/` 가 아니라 **`tests_e2e/`** 에 둔다 —
    # `[tool.pytest.ini_options]` 의 `testpaths = ["tests"]` 가 그것을 본 실행에서
    # 수집하지 않는다. 마커나 `skip` 으로 거르지 않는 이유는 `tests_e2e/__init__.py`
    # 머리말에 적었다. 깔리는 것 자체는 무해하다(둘 다 순수 파이썬 휠이다).
    "playwright>=1.48",
    # 노드가 아예 없는 저장소다(`grep -rn "node\|npm\|npx" .github/workflows/`
    # → 0건). 이 휠은 **`axe.min.js` 를 안에 담아** 오므로 `@axe-core/cli` 와 달리
    # `setup-node` 를 CI 에 들이지 않는다 — 고른 근거는
    # `tests_e2e/test_axe_accessibility.py` 머리말이 갖는다.
    "axe-playwright-python>=0.1.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "app*", "infra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # 수용기준 추적 (NFR-107). scripts/gen_traceability.py 가 이 마커를 수집한다.
    "req(criterion_id): 이 테스트가 검증하는 spec 수용기준 ID",
    # 수동 검증 스텁 (NFR-107-AC1.manual). 실행하지 않고 매핑 존재만 확인한다.
    # 이 마커를 단 테스트는 docs/manual-checks.yaml 에 함께 등재해야 한다 (AC3).
    "manual: 사람이 수행하는 검증의 명세 스텁. CI는 실행하지 않는다",
    "contract: 계약 테스트 (L3). 계약을 구현하는 쪽이 반드시 통과해야 한다",
]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

# 규칙 집합을 명시한다. 비워 두면 ruff 판올림마다 검사 범위가 조용히
# 바뀌어, 어제 통과한 코드가 오늘 실패하거나 그 반대가 된다.
[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # flake8-bugbear — B023(루프 변수 클로저) 등 실제 버그
    "SIM",       # flake8-simplify
    "UP",        # pyupgrade
    "PL",        # pylint
    "RUF",
]
ignore = [
    "PLR2004",   # magic value — 테스트에서 기대값 리터럴은 정상이다
    "PLR0913",   # 인자 수 — 자원 생성자는 파라미터가 많은 것이 본질이다
    "RUF002",    # 문서·주석이 한국어다. 전각 문자 경고는 전부 오탐이다
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 검사 도구는 **선형 절차**다. 검사 N종을 순서대로 수행하고 각각을 보고하는
# 구조이므로 분기·문장 수가 많은 것이 정상이며, 억지로 쪼개면 "어떤 순서로
# 무엇을 검사하는가"가 흩어져 오히려 읽기 어려워진다. 복잡도 규칙만 면제하고
# 버그 규칙(B·F·SIM)은 그대로 적용한다.
"scripts/*.py" = ["PLR0911", "PLR0912", "PLR0915"]
# 음성 테스트는 결함을 일부러 만들어 검사기에 먹인다. sys.path 를 조작한 뒤
# import 하는 것도 그 성격상 불가피하다.
"scripts/negtest_*.py" = ["PLW1510", "S603", "E402", "PLR0911", "PLR0912", "PLR0915"]
# 테스트는 지역 import 로 검사 대상을 좁히는 것이 의도적이다 — 모듈 상단에
# 올리면 "이 테스트가 무엇을 보는가"가 파일 전체로 번진다.
"tests/*.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["core"]

[tool.coverage.run]
branch = true
source = ["core"]
