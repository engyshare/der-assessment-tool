# 테스트·정적검사·NFR-105 게이트 — 작업 2.5·2.6 / spec NFR-105
#
# **왜 별도 파일인가.** §16.4는 `.github/workflows/` 의 편집 규칙을 *"잡(job)
# 단위 파일 분할"* 로 규정한다. `source-rules.yml` 은 문서 게이트(정본 대조·매핑·
# 가정 대장·파일 규모)를 담고 있고, 그 `on.push.paths` 에는 **`core/**` 가 없다**
# — 코드만 고친 push 는 그 워크플로를 아예 깨우지 않는다. 같은 파일에 코드
# 게이트를 넣으면 경로 필터를 넓혀야 하고, 그러면 문서 게이트가 코드 변경마다
# 돌아 두 관심사가 한 파일에서 얽힌다.
#
# **게이트 3종 중 둘이 여기 있다** (NFR-105 Measurement).
#
#   ① 변경분 커버리지 ≥ 95%   diff-cover        — 작업 2.5, 차단
#   ② 테스트 동반 검사        check_test_...    — 작업 2.6, 차단
#   ③ 커밋 순서 검사          미구현             — 조항이 **경고**로 규정. 스쿼시
#                                                병합 등 정당한 예외가 있어 차단
#                                                으로 켤 수 없다
#
# **①②는 PR 에서만 판정된다.** 기준 브랜치가 있어야 «변경분» 이 정의되기 때문
# 이다. push 에서는 조용히 건너뛰지 않고 **건너뛴다고 말한다** — 로그에 아무것도
# 없으면 «통과» 와 «수행하지 않음» 이 구별되지 않는다 (§13.0.1 ④).

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ── SC-5 비밀 문자열 (작업 2.3) ────────────────────────────────────
  #
  # **별도 잡인 이유.** gitleaks 는 저장소 **이력 전체**를 훑으므로 테스트 잡의
  # 얕은 관심사와 수명이 다르고, 실패했을 때 «무엇이 유출됐나» 만 보이면 된다.
  # 우리 도구(`check_disclosure.py`)는 gitleaks 가 보지 않는 것 — 로컬 절대
  # 경로·비공개 시드 파일·개별 식별정보 — 만 보며, 규칙을 두 곳에 두지 않는다.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 이력 전체를 본다. 얕은 클론이면 **과거 커밋에 남은 비밀을 보지
          # 못한 채 초록불**이 된다 — 비밀은 지워도 이력에 남는 것이 문제이므로
          # 최근 커밋만 보는 스캔은 정확히 그 문제를 놓친다.
          fetch-depth: 0

      - name: gitleaks
        # 액션 대신 릴리스 바이너리를 쓴다 — 조직 저장소에서 라이선스 키를
        # 요구하는 경로를 피하고, 판올림 시점을 우리가 고정한다.
        env:
          GITLEAKS_VERSION: "8.18.4"
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # `--config` 를 명시한다. 빠뜨리면 기본 규칙만 돌아 **08-08 이후
          # 계속 빨간불이던 오탐 8건**(대장의 `key:` 필드)이 되살아난다.
          # 설정 파일의 존재를 먼저 단언하는 이유: 이름이 바뀌거나 사라지면
          # gitleaks 는 조용히 기본 설정으로 내려가고, 그때 «면제가 넓어진
          # 것」과 «면제가 사라진 것」이 결과만으로는 구별되지 않는다.
          test -f .gitleaks.toml
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose

      - name: 스캔이 실제로 잡는지 확인
        # 「탐지 0건」이 «비밀이 없다» 는 뜻인지 «규칙이 아무것도 매치하지
        # 않는다» 는 뜻인지 결과만 보고는 구분되지 않는다 (§13.0.1 ④).
        # 가짜 키를 심어 **탐지되는 것**을 확인하고 지운다.
        # **08-09 정정 — 이 단계는 통과할 수 없는 상태였고 한 번도 실행되지
        # 않아 드러나지 않았다.** 심어 둔 키가 AWS 문서의 예시 키
        # (`wJalrXUtnFEMI/…EXAMPLEKEY`)였고, **gitleaks 는 그것을 기본
        # 허용목록에 두어 의도적으로 무시한다.** 즉 「스캔이 살아 있는가」를
        # 확인하려고 심은 것이 스캔이 절대 잡지 않는 값이었다.
        #
        # 그런데 앞 단계(gitleaks)가 오탐으로 먼저 실패해 이 단계는 계속
        # `skipped` 였다. **빨간불 하나가 다른 빨간불을 가리고 있었던 것**이며,
        # 앞 단계를 고치자마자 이것이 처음으로 돌면서 드러났다.
        #
        # 이제 **실제로 탐지되는 값**을 심는다. 세 가지를 한꺼번에 심어
        # 규칙군이 넓게 살아 있는지 본다 — 하나만 심으면 그 규칙 하나가
        # 죽었을 때 «스캔이 무력하다» 와 «그 규칙만 죽었다» 가 구별되지 않는다.
        #
        # **심는 값을 조각으로 조립한다 — 리터럴로 적으면 푸시가 막힌다.**
        # 실측: 완성된 Slack 토큰을 이 파일에 적었더니 **GitHub push
        # protection 이 푸시를 거절**했다(`GH013 … Slack API Token,
        # tests.yml:90`). 스캐너가 살아 있음을 증명하려고 심은 값이 다른
        # 스캐너에 걸린 것이며, **그쪽도 제 일을 한 것이다.**
        #
        # 08-08 에 `SC-3` 탐지기를 검증하는 테스트가 탐지 대상을 리터럴로
        # 들고 있어 스스로 위반이 됐을 때와 **같은 형태이고 해법도 같다** —
        # 면제를 넓히지 않고 **대상을 바꾼다.** 조각으로 조립하면 소스에는
        # 비밀 모양이 남지 않고 실행 시점에만 완성된다.
        run: |
          set -uo pipefail
          aws_a="K7pQ2mXvR9tLwZ4n"; aws_b="B6cF8jH1sD3gY5aU0eI7oT2r"
          gen_a="aB3xY9kL2mQ7pR4t"; gen_b="W8vZ1nC5dF6gH0jKuI7oP2sD"
          slk_a="xox"; slk_b="b-2451234567-2451234567-"
          slk_c="QwErTyUiOpAsDfGhJkLzXcVb"
          {
            printf 'aws_secret_access_key = "%s%s"\n' "$aws_a" "$aws_b"
            printf 'service_token: "%s%s"\n'          "$gen_a" "$gen_b"
            printf 'SLACK_TOKEN=%s%s%s\n'             "$slk_a" "$slk_b" "$slk_c"
          } > /tmp/planted.txt
          cp /tmp/planted.txt ./_negtest_secret.txt
          set +e
          # **게이트와 같은 `--config` 로 돌린다.** 빠뜨리면 이 음성 확인이
          # 기본 규칙을 검증하게 되어 «우리 설정이 무언가를 잡는다» 는
          # 증거가 되지 못한다 — 검증 대상과 검증에 쓰는 설정이 다르면
          # 그 통과는 다른 것에 대한 통과다.
          /tmp/gitleaks detect --source . --config .gitleaks.toml \
            --no-git --redact > /tmp/out.txt 2>&1
          rc=$?
          set -e
          rm -f ./_negtest_secret.txt
          if [ "$rc" = "0" ]; then
            echo "::error::심어 둔 가짜 키를 gitleaks 가 잡지 못했습니다 — 스캔이 무력합니다"
            cat /tmp/out.txt
            exit 1
          fi
          echo "심어 둔 키를 탐지했습니다 (종료 코드 $rc) — 스캔이 살아 있습니다"

  # ── 테스트·정적검사 ────────────────────────────────────────────────
  #
  # 08-08까지 CI에는 이 잡이 **없었다.** pytest·ruff·import-linter 는 사람이
  # 로컬에서 부를 때만 돌았고, 그것은 「검사가 있다」가 아니라 「검사를 기억하면
  # 돈다」다. 자원 6종이 병렬로 들어온 직후가 특히 위험했다.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 게이트 ①②는 기준 브랜치와의 **병합 기점**을 본다. 얕은 클론이면
          # 그 ref 나 공통 조상이 로컬에 없고, 그러면 판정이 성립하지 않는다.
          # (diff-cover 10.4.2 는 ref 가 아예 없을 때는 오류로 멈춘다 — 실측.
          # 조용히 통과하는 쪽은 **경로가 어긋난 산출물**이며 그것은 입력
          # 검증 단계가 잡는다.)
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성
        # **optional-dependency 그룹을 여기 손으로 나열하는 것이 결함의
        # 근원이다.** 08-09 에 두 번 같은 일이 났다 —
        #   ① `persistence` 누락 → `tests/infra` 가 sqlalchemy 를 못 찾아
        #      **수집 오류가 조용히** 나고 CI 는 그 테스트를 한 번도 돌리지
        #      않은 채 초록불이었다.
        #   ② `api` 누락 → 같은 형태로 `tests/app` 이 빠졌다.
        #
        # `pytest` 는 import 오류 파일을 건너뛰고 **종료 코드 0** 을 낼 수
        # 있다. 「검사가 통과했다」와 「검사가 무언가를 검사했다」의 간극이
        # 여기서도 나온다.
        #
        # 그래서 **그룹을 `pyproject.toml` 에서 읽어 전부 설치한다.** 새
        # 그룹이 생겨도 이 파일을 고칠 필요가 없고, 고치는 것을 잊어서
        # 조용히 빠지는 일이 구조적으로 사라진다 (NFR-207 과 같은 원리 —
        # 중앙 목록을 두지 않는다).
        run: |
          set -euo pipefail
          groups=$(python -c "
          import tomllib
          with open('pyproject.toml','rb') as f:
              print(','.join(tomllib.load(f)['project']['optional-dependencies']))")
          echo "설치 그룹: $groups"
          test -n "$groups"
          pip install -e ".[$groups]"

      # NFR-405-AC1 (작업 2.12) — *"의존성 취약점 CI 자동 스캔"*.
      #
      # **조항이 요구하는 것은 「스캔이 돈다」이지 「취약점이 0건이다」가
      # 아니다.** NFR-405 는 **Should-have** 이고 조항 자신이 *"자동 스캔이
      # 없어도 시스템은 동작한다"* 고 적어 두었다. 발견 즉시 차단으로 켜면
      # 우리가 고칠 수 없는 상류 라이브러리의 미수정 취약점 하나로 CI 가
      # 영구히 빨간불이 되고, **통과할 수 없는 검사는 꺼진다** — NFR-206 을
      # 차단이 아니라 경고로 켠 것과 같은 판단이다(2.9).
      #
      # 그래서 **발견은 경고, 미수행은 실패**로 가른다. 이 저장소가 반복해서
      # 만난 간극이 「검사가 통과했다」와 「검사가 무언가를 검사했다」이며,
      # 여기서 지켜야 할 것은 후자다. 출력이 비면 스캔이 돌지 않은 것이고
      # 그때는 멈춘다 — `|| true` 로 종료 코드만 버리면 도구가 없어도
      # 초록불이 된다(2.7 에서 닫은 구멍과 같은 형태).
      - name: 의존성 취약점 스캔 (NFR-405)
        run: |
          set -uo pipefail
          pip-audit --progress-spinner off | tee audit.txt || true
          if [ ! -s audit.txt ]; then
            echo "::error::pip-audit 이 아무 출력도 내지 않았습니다 — 스캔이 돌지 않았습니다"
            exit 1
          fi
          if grep -qiE "GHSA-|PYSEC-|CVE-" audit.txt; then
            echo "::warning::의존성 취약점이 있습니다 (위 목록). NFR-405 는 Should-have 이므로 차단하지 않습니다"
          fi

      - name: ruff
        run: python -m ruff check core tests scripts

      # NFR-204-M1 (작업 2.4). `strict = true` 는 08-08 이전부터
      # `pyproject.toml` 에 있었지만 **아무도 돌리지 않아 5건이 쌓여 있었다** —
      # 설정 파일에 규칙이 적혀 있다는 것과 그 규칙이 강제된다는 것은 다르다.
      # 이 저장소가 CODEOWNERS·import-linter 에서 이미 두 번 만난 간극이다.
      #
      # 대상은 `core` 다(`[tool.mypy] files`). 테스트·도구까지 strict 로 묶으면
      # 임시 스텁과 음성 케이스가 타입 오류가 되고, 통과시키려고 검사 대상을
      # 무르게 만드는 압력이 생긴다.
      - name: mypy strict (NFR-204)
        run: python -m mypy

      # NFR-202(정책·시장 파라미터 하드코딩) · NFR-205(전역 가변 상태) — 작업 2.9.
      #
      # NFR-202 는 작업 16.1이 「나중에 값을 교체할 수 있다」를 세우기 위해 든
      # 세 장치 중 셋째다. 대장(`assumptions.yaml`)과 대장 검사만으로는 부족
      # 하다 — *"대장만 있으면 누군가 값을 소스에 옮겨 적는다."* 옮겨 적히는
      # 순간 대장은 정본이 아니라 사본이 된다.
      - name: NFR-202 · NFR-205 파라미터·전역 상태
        run: python scripts/check_hardcoded_params.py

      - name: 도구 감지 능력 확인 (음성 7 + 양성 4 + 경계 5)
        # 이 검사는 「차단 0건」으로 통과한다. 그 통과가 «복제가 없다» 는 뜻인지
        # «문턱이 너무 높아 아무것도 보지 않는다» 는 뜻인지 결과만 보고는
        # 구분되지 않는다 (§13.0.1 ④). 문턱 값 자체도 함께 고정한다.
        run: python scripts/negtest_hardcoded_params.py

      # SC-3·SC-8 비공개 유입 — 작업 2.3.
      #
      # pre-commit 훅과 **둘 다** 둔다. 훅은 `--no-verify` 한 줄로 우회되고,
      # CI 는 이미 커밋된 뒤에 본다. 비공개 데이터는 커밋되는 순간 이력에
      # 남으므로 「나중에 지우면 된다」가 성립하지 않는다.
      - name: SC-3 · SC-8 비공개 유입
        run: python scripts/check_disclosure.py

      - name: 도구 감지 능력 확인 (음성 9 + 양성 6 + 경계 2)
        # 비밀 스캔은 규칙이 조용히 무력해져도 **매일 초록불**이고, 알아차리는
        # 시점은 이미 공개된 뒤다. 양성을 함께 보는 이유가 여기서 더 크다 —
        # 오탐이 잦으면 규칙을 넓히는 압력이 생기고, 넓어진 규칙은 진짜 유출도
        # 통과시킨다.
        run: python scripts/negtest_disclosure.py

      - name: import-linter — 구획 경계 4계약 (NFR-208)
        # `python -m importlinter.cli lint` 로 부르지 **않는다.** 그 모듈에는
        # `__main__` 가드가 없어 import만 되고 끝나며 **종료 코드 0**을 낸다 —
        # 위반을 심어도 초록불이다. 콘솔 스크립트를 부른다.
        run: lint-imports

      # `--cov-fail-under=85` 는 NFR-203-M1(작업 2.10)이다. 게이트 ①(변경분
      # 95%)과 별개로 필요하다 — ①은 **신규 코드만** 보므로, 기존 코드의
      # 커버리지가 서서히 내려가는 것을 아무도 보지 않는다. 하나는 들어오는
      # 것을, 하나는 이미 있는 것을 지킨다.
      #
      # 85%는 조항 문면이다. 지금 90%이므로 여유가 있으나, `source = ["core"]`
      # 때문에 **테스트가 import하지 않은 추상 인터페이스도 0%로 분모에 있다** —
      # 구현이 붙으면 그것들이 먼저 채워진다. 하한을 올릴지는 그때 판단하며,
      # 그것은 spec 개정이다(§16.5).
      # **수집 오류를 「조용한 통과」로 두지 않는다.**
      #
      # `pytest` 는 import 오류가 난 파일을 건너뛰고 나머지만 세며 종료 코드
      # 0 을 낼 수 있다. 08-09 에 두 번 그랬다 — `tests/infra` 와 `tests/app`
      # 이 통째로 빠진 채 CI 는 초록불이었고, **테스트가 없다는 사실이
      # 어디에도 나타나지 않았다.**
      #
      # 그래서 본 실행 앞에서 **수집만 해 보고 오류가 하나라도 있으면
      # 멈춘다.** 이것이 없으면 다음에 새 구획이 들어올 때 같은 일이 난다.
      - name: 수집 오류 0건 확인 (테스트가 조용히 빠지지 않는가)
        run: |
          set -uo pipefail
          python -m pytest --collect-only -q > /tmp/collect.txt 2>&1
          rc=$?
          tail -5 /tmp/collect.txt
          if [ "$rc" != "0" ] || grep -qiE "^ERROR|errors? during collection" /tmp/collect.txt; then
            echo "::error::테스트 수집에 실패한 파일이 있습니다 — 의존성 그룹 누락일 수 있습니다"
            grep -iE "^ERROR|ModuleNotFoundError|ImportError" /tmp/collect.txt | head -20
            exit 1
          fi

      - name: pytest + 커버리지 (NFR-203 85%)
        run: |
          python -m pytest --cov=core --cov-branch --cov-report=xml \
            --cov-report=term --cov-fail-under=85

      # ── 게이트 ① 변경분 커버리지 ≥ 95% (작업 2.5) ─────────────────
      #
      # 전체 커버리지(NFR-203, 85%)와 별개로 **신규 코드에 더 높은 기준**을
      # 적용한다. 이유는 조항 근거에 있다 — 이 시스템의 산출물은 정책 판단
      # 근거이고, 계산 오류는 화면상 정상 동작으로 보이므로 사후 발견이 어렵다.
      # 이미 있는 코드의 미검증분은 서서히 갚되, **지금 들어오는 코드는 검증과
      # 함께 들어와야 한다.**
      #
      # 입력 검증이 **먼저** 온다. diff-cover 는 판정할 수 없을 때 통과하기
      # 때문이다 — `coverage.xml` 의 경로가 어긋나면 «No lines with coverage
      # information in this diff» 를 출력하고 종료 코드 0 을 낸다(실측). 문서만
      # 고친 PR 에서는 그것이 옳고, `core/` 를 고친 PR 에서는 정반대의 뜻인데
      # 출력과 종료 코드가 같아 로그로도 구별되지 않는다.
      - name: 게이트 ① 입력 검증 (PR)
        if: github.event_name == 'pull_request'
        run: |
          python scripts/check_coverage_inputs.py --base "origin/${{ github.base_ref }}"

      - name: 게이트 ① 변경분 커버리지 (PR)
        if: github.event_name == 'pull_request'
        run: |
          diff-cover coverage.xml \
            --compare-branch "origin/${{ github.base_ref }}" \
            --fail-under=95 \
            --diff-range-notation '...' \
            --markdown-report diff-cover.md
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"

      - name: 게이트 ① 건너뜀 (push)
        if: github.event_name != 'pull_request'
        run: |
          echo "게이트 ①은 PR 에서만 판정합니다 — 기준 브랜치가 있어야 «변경분»이" \
               "정의됩니다. 이 실행은 통과가 아니라 **미수행**입니다." \
               >> "$GITHUB_STEP_SUMMARY"

      # ── 게이트 ② 테스트 동반 검사 (작업 2.6) ──────────────────────
      - name: 게이트 ② 테스트 동반 (PR)
        if: github.event_name == 'pull_request'
        run: python scripts/check_test_accompaniment.py --base "origin/${{ github.base_ref }}"

      - name: 게이트 ② 건너뜀 (push)
        if: github.event_name != 'pull_request'
        run: |
          echo "게이트 ②는 PR 에서만 판정합니다. 이 실행은 통과가 아니라 **미수행**입니다." \
               >> "$GITHUB_STEP_SUMMARY"
