name: source-rules

on:
  push:
    paths:
      - "docs/assumptions.yaml"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/source-rules.yml"
  pull_request:
  workflow_dispatch:

jobs:
  # ── 잠정 가정 대장 (§15.1) ────────────────────────────────────────
  #
  # 전제 데이터를 가정값으로 진행하기로 했으므로, 가정이 조용히 사실로 굳는
  # 것을 막는 검사가 게이트에 있어야 한다. 특히 검증 정박점(Q-4·Q-5)에
  # 가정값이 들어가면 우리가 만든 값으로 우리 계산을 검증하게 된다.
  assumptions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      - name: 가정 대장 검사
        run: python scripts/check_assumptions.py

      - name: 도구 감지 능력 확인 (음성 테스트)
        run: python scripts/negtest_assumptions.py

  # ── 파일 규모 (NFR-206) ───────────────────────────────────────────
  #
  # **경고이고 차단이 아니다.** NFR-206 은 Should-have 이고 측정 수단이
  # `M1 lint 경고` 로 규정되어 있다. 차단으로 켜면 조항이 요구하지 않은 강제력을
  # 갖고, 통과시키려고 근거 주석을 지우는 압력이 생긴다 — 조항의 근거
  # (DER-VET `Params.py` 1,830줄)는 코드 스프롤을 막으려는 것이지 설명을
  # 줄이려는 것이 아니다.
  #
  # 저장소 전체를 훑는 이유: 이 검사를 쓴 것은 WP-1e 하나뿐이었고 자기 파일
  # 둘만 보았다. 나머지 넷은 감시 밖이었고 상한을 넘긴 것이 정확히 그 넷이다.
  # 도구 파일 2건은 그 사각지대에서 811줄·571줄까지 자라 있었다.
  file-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 파일 규모 검사
        id: size
        run: |
          set +e
          python scripts/check_file_size.py --strict | tee size.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 코드 스프롤은 차단한다
        # 총 줄 수 초과는 경고지만 **코드 줄 수 초과는 다르다** — 그것이 조항의
        # 근거(DER-VET `Params.py` 1,830줄)에 해당하는 상태다. 현재 저장소는
        # 코드 기준으로 전건 이내이므로 지금 켜도 초록불이며, 켜 두면 이후
        # 코드가 상한을 넘는 순간 그때 잡힌다.
        run: python scripts/check_file_size.py --code-strict

      - name: 도구 감지 능력 확인 (음성 6 + 양성 2종)
        # 「코드 스프롤 0건」이 *없다* 는 뜻인지 *못 잡는다* 는 뜻인지 결과만
        # 보고는 구분되지 않는다 (§13.0.1 ④). 특히 독스트링을 과대 계산하면
        # 진짜 스프롤이 「설명 밀도」로 새어 경고가 무해해 보인다.
        run: python scripts/negtest_file_size.py

      - name: 요약
        if: always()
        run: |
          {
            echo "## 파일 규모 (NFR-206 · 500줄)"
            echo
            echo '```'
            cat size.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 초과 시 경고 주석
        if: steps.size.outputs.exit_code != '0'
        run: |
          echo "::warning::NFR-206 상한(500줄) 초과 파일이 있습니다. 작업 요약을 확인하십시오."
