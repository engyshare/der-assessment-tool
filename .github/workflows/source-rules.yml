# 정본 규칙 문서 대조 — spec §16.5.3
#
# 볼트(Obsidian)는 CI에서 접근할 수 없다. 따라서 이 잡은 저장소 사본
# (docs/domain-rules.md 등)을 정본 대신 읽는다. 사본이 정본과 바이트 동일해야
# 성립하며, 그 조건은 §16.5.3 절차 5가 규정한다.
#
# 권위 있는 검사는 볼트가 있는 로컬에서 수행된다. CI의 역할은
# "spec ↔ lock 정합"과 "인용 규칙 위반"을 잡는 것이며, 이 둘은 볼트 없이도
# 완전히 검사된다.
#
# 경고이지 차단이 아니다 (§16.5.3 절차 2). 정본 개정은 잘못이 아니라 사건이며,
# PR을 막을 일이 아니라 알아차려야 할 일이다. 차단으로 바꾸려면 --strict 를
# 주고 continue-on-error 를 지운다.

name: source-rules

on:
  push:
    paths:
      - "rslt/spec-*.md"
      - "rslt/task-*.md"
      - "docs/source-rules.lock"
      - "docs/domain-rules.md"
      - "docs/evidence-standard.md"
      - "docs/manual-checks.yaml"
      - "docs/traceability.md"
      - "docs/assumptions.yaml"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/source-rules.yml"
  pull_request:
  schedule:
    # 정본은 저장소 밖에서 바뀌므로 push 이벤트가 발생하지 않는다.
    # 매일 한 번 능동 확인한다. 09:00 KST = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  collate:
    runs-on: ubuntu-latest
    continue-on-error: true      # 경고 상태 (§16.5.3 절차 2)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      - name: 정본 대조
        id: collate
        run: |
          set +e
          python scripts/check_source_rules.py | tee result.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 정본 규칙 문서 대조"
            echo
            if [ "${{ steps.collate.outputs.exit_code }}" = "0" ]; then
              echo "정합합니다."
            else
              echo "**표류를 감지했습니다.** spec §16.5.3 절차 3~5를 수행하십시오."
              echo
              echo "1. §16.5.1 파생 관계표를 따라 영향 FR 전수 재검토"
              echo "2. 정본 어휘 변경 시 DB enum·UI 라벨·테스트 픽스처까지 추적"
              echo "3. \`python scripts/check_source_rules.py --update\` 후 검토·커밋"
              echo "4. 저장소 사본 동기화"
            fi
            echo
            echo '```'
            cat result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 표류 시 경고 주석
        if: steps.collate.outputs.exit_code != '0'
        run: |
          echo "::warning file=docs/source-rules.lock::정본 규칙 문서가 spec과 어긋납니다. 작업 요약을 확인하십시오."

  # ── 수용기준 추적 매핑 (NFR-107) — 작업 2.7 게이트 ────────────────
  #
  # traceability.md 는 생성물이다. 커밋된 것이 지금 spec으로 다시 생성한 것과
  # 다르면, 누군가 spec을 고치고 표를 갱신하지 않았거나 표를 직접 편집한 것이다.
  # 둘 다 표를 믿을 수 없게 만든다.
  #
  # **이 게이트가 무엇을 판정하는가 — 「미매핑 0건」이 아니다.**
  #
  #   판정한다   ① spec 수용기준 선언에 결함이 없다 (종료 코드 2)
  #              ② 커밋된 매핑표가 지금 spec과 일치한다
  #              ③ 게이트 자신이 수동 대장으로 자기충족되지 않았다
  #              ④ 수동 스텁에 수행 기록이 있다
  #
  #   판정하지 않는다   미매핑 0건. 그것은 **Phase 1 DoD(17.9)** 이며 현재
  #                     기준선은 261건이다. 지금 절대 0을 요구하면 CI가 영구히
  #                     빨간불이 되고, 통과시키려고 §13.0.2가 금지한 자기충족
  #                     테스트를 짓게 된다 — 게이트가 막으려던 바로 그 상태다.
  #
  # 미매핑 수의 증가는 ②가 잡는다. Must-have 수용기준이 늘거나 인용이 빠지면
  # 표가 달라지고, 갱신본을 커밋하는 순간 그 증가가 diff에 남아 사람이 본다.
  # 별도 기준선 파일을 두지 않는 이유다 — 같은 사실이 두 곳에 있으면 어긋난다.
  traceability:
    runs-on: ubuntu-latest
    # v0.10(2.7): 경고 → **차단**. 선행 4건이 모두 충족되어 게이트를 켠다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      - name: 매핑표 재생성 후 커밋본과 대조
        run: |
          set +e
          cp docs/traceability.md /tmp/committed.md
          python scripts/gen_traceability.py > /tmp/gen.log 2>&1
          rc=$?
          cat /tmp/gen.log

          # 종료 코드 2 = 결함. 이때 **매핑표는 생성되지 않는다.**
          #
          # 예전에는 `|| true` 로 코드를 버렸는데, 파일이 안 바뀌므로 아래
          # diff 가 통과했다. 즉 spec 수용기준 선언에 결함이 있을 때 게이트가
          # 조용히 초록불이 되는 구멍이 있었다 — 검사를 못 한 것을 통과로
          # 읽던 상태다. 여기서 닫는다.
          if [ "$rc" = "2" ]; then
            echo "::error file=rslt::수용기준 선언 결함으로 매핑표를 생성하지 못했습니다. \
          위 로그의 결함을 고치십시오."
            exit 1
          fi

          # 종료 코드 1 = 미매핑 존재. 테스트가 없는 Wave 0에서는 정상이다.
          if ! diff -q /tmp/committed.md docs/traceability.md > /dev/null; then
            echo "::error file=docs/traceability.md::매핑표가 spec과 어긋납니다. \
          'python scripts/gen_traceability.py' 를 실행하고 결과를 커밋하십시오."
            diff /tmp/committed.md docs/traceability.md | head -40
            exit 1
          fi
          echo "매핑표 최신 상태 (종료 코드 $rc — 1은 미매핑 잔존이며 Wave 0에서 정상)"

      - name: 도구 감지 능력 확인 (음성 테스트)
        # 검사기가 통과했다는 사실만으로는 그것이 무언가를 검사한다는 증거가
        # 되지 않는다 (§13.0.1 ④). 게이트를 켠 이상 게이트 자신도 검사한다.
        run: python scripts/negtest_traceability.py

      - name: 요약
        if: always()
        run: |
          {
            echo "## 수용기준 추적 (NFR-107)"
            echo
            echo '```'
            cat /tmp/gen.log 2>/dev/null || echo "(생성 로그 없음)"
            echo '```'
            echo
            echo "미매핑 0건은 Phase 1 DoD(17.9)이며 이 게이트의 판정 대상이 아닙니다."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 조항 마커의 실질 (NFR-107) ────────────────────────────────────
  #
  # 매핑표는 «조항을 인용한 테스트가 있는가» 만 본다. **인용한 테스트가
  # 무엇이든 검증하는가는 보지 않는다.** 그래서 본문이 `pass` 한 줄이거나
  # `print` 만 하는 테스트가 조항 마커를 달면 그 조항은 매핑표에서 초록불이
  # 된다 — 미매핑은 「빠졌다」고 말하지만 이것은 「덮였다」고 말한다.
  #
  # 실제로 세 번 일어났다. `FR-611-AC4` 는 `pass` 한 줄이 조항 셋을 덮고
  # 있었고 파 보니 **구현도 미충족**이었다. 08-10 에 전수로 훑어 세 건을 더
  # 찾았다(`FR-1001-AC5`·`FR-1103-AC1`·`NFR-107-M1`).
  #
  # **손으로 훑은 것은 다음에 또 잠든다.** 그래서 게이트로 세운다.
  #
  # 잡는 것은 «검증 행위가 하나도 없는 것» 뿐이다. 「약한 단언」은 넣지
  # 않았다 — 기계가 판정할 수 없고, 실제로 구문 훑기가 짚은 두 건이 둘 다
  # 오판이었다(`isinstance(v, bool)` 이 곧 조항인 경우, 값 검증이 이웃
  # 테스트에 있는 경우). 오탐이 나는 게이트는 결국 꺼진다.
  marker-substance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 조항 마커 실질 검사
        run: python scripts/check_marker_substance.py

      - name: 도구 감지 능력 확인 (음성 테스트)
        # 검사기가 통과했다는 사실만으로는 그것이 무언가를 검사한다는 증거가
        # 되지 않는다 (§13.0.1 ④). 8종 중 3종은 잡혀야 하고 5종은 잡히면
        # 안 된다 — 「전부 위반」이라고 답하는 검사도 앞의 셋만으로는 통과한다.
        run: python scripts/negtest_marker_substance.py

  # ── 잠정 가정 대장 (§15.1) ────────────────────────────────────────
  #
  # 전제 데이터를 가정값으로 진행하기로 했으므로, 가정이 조용히 사실로 굳는
  # 것을 막는 검사가 게이트에 있어야 한다. 특히 검증 정박점(Q-4·Q-5)에
  # 가정값이 들어가면 우리가 만든 값으로 우리 계산을 검증하게 된다.
  assumptions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      - name: 가정 대장 검사
        run: python scripts/check_assumptions.py

      - name: 도구 감지 능력 확인 (음성 테스트)
        run: python scripts/negtest_assumptions.py

  # ── 파일 규모 (NFR-206) ───────────────────────────────────────────
  #
  # **경고이고 차단이 아니다.** NFR-206 은 Should-have 이고 측정 수단이
  # `M1 lint 경고` 로 규정되어 있다. 차단으로 켜면 조항이 요구하지 않은 강제력을
  # 갖고, 통과시키려고 근거 주석을 지우는 압력이 생긴다 — 조항의 근거
  # (DER-VET `Params.py` 1,830줄)는 코드 스프롤을 막으려는 것이지 설명을
  # 줄이려는 것이 아니다.
  #
  # 저장소 전체를 훑는 이유: 이 검사를 쓴 것은 WP-1e 하나뿐이었고 자기 파일
  # 둘만 보았다. 나머지 넷은 감시 밖이었고 상한을 넘긴 것이 정확히 그 넷이다.
  # 도구 파일 2건은 그 사각지대에서 811줄·571줄까지 자라 있었다.
  file-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 파일 규모 검사
        id: size
        run: |
          set +e
          python scripts/check_file_size.py --strict | tee size.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 코드 스프롤은 차단한다
        # 총 줄 수 초과는 경고지만 **코드 줄 수 초과는 다르다** — 그것이 조항의
        # 근거(DER-VET `Params.py` 1,830줄)에 해당하는 상태다. 현재 저장소는
        # 코드 기준으로 전건 이내이므로 지금 켜도 초록불이며, 켜 두면 이후
        # 코드가 상한을 넘는 순간 그때 잡힌다.
        run: python scripts/check_file_size.py --code-strict

      - name: 도구 감지 능력 확인 (음성 6 + 양성 2종)
        # 「코드 스프롤 0건」이 *없다* 는 뜻인지 *못 잡는다* 는 뜻인지 결과만
        # 보고는 구분되지 않는다 (§13.0.1 ④). 특히 독스트링을 과대 계산하면
        # 진짜 스프롤이 「설명 밀도」로 새어 경고가 무해해 보인다.
        run: python scripts/negtest_file_size.py

      - name: 요약
        if: always()
        run: |
          {
            echo "## 파일 규모 (NFR-206 · 500줄)"
            echo
            echo '```'
            cat size.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 초과 시 경고 주석
        if: steps.size.outputs.exit_code != '0'
        run: |
          echo "::warning::NFR-206 상한(500줄) 초과 파일이 있습니다. 작업 요약을 확인하십시오."

  # ── 구획 배정 검사 (작업 2.11) ─────────────────────────────────────────
  partition-assignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 구획 배정 검사
        run: python scripts/check_partition_assignment.py
      - name: 도구 감지 능력 확인 (음성 테스트)
        run: python scripts/negtest_partition_assignment.py

  # 정본 대조는 위 `collate` 잡이 `continue-on-error: true` 로 돈다 —
  # 표류는 경고 상태다(§16.5.3 절차 2). **그러나 「검사기가 표류를 잡는가」는
  # 경고가 아니라 차단이다.** 감지 못 하는 게이트는 초록불이 아무 뜻도 없고,
  # 그것이 이 저장소가 가장 경계하는 상태다. 그래서 별도 잡으로 두고
  # `continue-on-error` 를 걸지 않는다.
  source-rules-negtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: 정본 대조 도구 감지 능력 확인 (음성 테스트)
        run: python scripts/negtest_source_rules.py

  # 작업 목록 인용 검사 — **R15 에 처음 CI 로 들어왔다.**
  #
  # `scripts/` 의 검사기 열 중 **이것만 어느 워크플로도 부르지 않았다.** 그래서
  # `rc=1` 이 로컬에서만 보이고 커밋은 초록불로 지나갔다. 그 사이 spec v0.13 이
  # `FR-202` 를 수용기준 단위로 쪼개고 v0.14 가 `FR-301-AC4` 를 신설했는데
  # **작업 목록이 따라오지 않아 미인용 Must-have 가 0 → 4건이 됐고**, 08-09 의
  # `status.md` 는 계속 「미인용 0건」이라 적고 있었다.
  #
  # **검사 자신은 경고다** (`continue-on-error`). 남은 3건(`FR-202-AC1`~`AC3`)이
  # **Phase↔Wave 정합 판단**이라 사용자 결정 전에는 닫을 수 없고, 차단으로 켜면
  # CI 가 영구히 빨간불이 되어 곧 무시된다 — 이 저장소가 가장 경계하는 상태다.
  # **감지 능력 확인(음성)은 차단이다.** 감지 못 하는 게이트의 초록불은 아무
  # 뜻이 없고, 그것은 사용자 결정과 무관하게 지금 판정할 수 있다.
  task-mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 작업 목록 인용 검사 (경고)
        id: cite
        continue-on-error: true
        run: |
          set +e
          python scripts/check_task_mapping.py > cite.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat cite.txt
      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 작업 목록 인용 검사"
            echo
            if [ "${{ steps.cite.outputs.exit_code }}" = "0" ]; then
              echo "정합합니다."
            else
              echo "**미인용·유령·범위 초과 인용이 있습니다.** spec 개정이"
              echo "수용기준을 늘렸는데 작업 목록이 따라오지 않은 경우가 대표적입니다."
            fi
            echo
            echo '```'
            cat cite.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 도구 감지 능력 확인 (음성 테스트 — 차단)
        run: python scripts/negtest_task_mapping.py
