# 대표일 24스텝 **형상** — 가정이며 실측이 아니다.
#
# ## 이 파일이 정하는 것과 정하지 않는 것
#
#   정한다      하루 안에서 **어떻게 배분되는가** (정규화 가중치)
#   정하지 않는다 총량 — 부하는 대장 `load.household.annual`,
#                발전은 `pv_capacity_kw` × 이용률이 정한다
#
# 형상과 총량을 한 곳에 두면 총량을 고칠 때 형상이 따라 움직이거나 그 반대가
# 된다. 여기서는 **배분만** 적고, 읽는 쪽이 총량을 곱해 되돌린다.
#
# ## 왜 소스가 아니라 자산인가
#
# 24개 숫자를 파이썬 상수로 두면 그것은 **대장 밖의 값**이 되고, 이 저장소가
# `NFR-202` 로 막으려는 형태가 된다. 값이 아니라 형상이므로 대장 항목의 꼴
# (`value` + `sensitivity` 3수준)에도 맞지 않아, 출처·신뢰도를 함께 적을 수
# 있는 자산으로 둔다.
#
# ## 인덱스 관례 — **인덱스 0 이 00~01시다**
#
# `weights[i]` 는 **i~(i+1)시** 의 가중치이며, 붙임 7 시간대별 표의 i 번째
# 행과 같은 스텝이다(그 표의 첫 행이 「00~01시」다).
#
# ⚠ **이 관례를 적지 않아 두 스텝 어긋남이 눈에 띄지 않았다** (R37 후속).
# 발전 형상의 부기가 「일출 06시 · 일몰 19시」라고 적고 있었는데 실물 가중치는
# 인덱스 7~20 이었다. 관례가 없으면 부기와 배열을 맞춰 볼 방법이 없다 — 아래
# 각 형상의 `derivation_method` 는 **이 관례로 읽는다.**
#
# ## ⚠ **발전** 형상은 결론을 만든다 · **부하** 형상은 만들지 않는다
#
# R37 이 발전 형상을 `build_case_report` 의 본 실행과 민감도·용량 스윕에
# 배선했다 — 그러므로 이 파일의 발전 가중치는 **프로포마와 순현재가치의
# 입력**이다. 고치면 결론이 움직인다.
#
# 부하 형상은 다르다. 읽는 쪽(붙임 7 둘째 표)은 그것으로 **운전만** 다시
# 그리고 프로포마는 건드리지 않는다 — 부하를 편익 계산에 태우면 잉여판매가
# 줄어드는데 그 대가인 자가소비 절감은 **배타 규칙 유형 A** 라 같은 프로포마에
# 함께 실을 수 없다(`FR-402-AC2.A`). 한쪽만 반영하면 사업에 불리한 쪽으로
# 틀린다(양식 4절 · NSPM 대칭성).

