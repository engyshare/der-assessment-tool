# ═════════════════════════════════════════════════════════════════════════
# 냉난방(추가 기기) 부하의 **계절별 몫** — R65/WP-2 · 사용자 요구 「계절별 냉난방 부하」
#
# ## 왜 위 `profiles:` 안이 아니라 별도 절인가
#
# 위 두 항목은 **하루 안의 형상(24스텝 가중치)** 과 계절 몫을 함께 갖는다.
# 이것은 **몫만** 갖는다 — 냉난방 부하가 하루 안에서 어떻게 배분되는지는 이
# 자산이 말하지 않고, 읽는 쪽
# (`core/casegrid/appliance_load.py::ApplianceSeasonShares._matched`)이
# **가구 부하 형상의 그 계절 가중치를 그대로 쓴다.** 그러므로 여기 `weights:`
# 를 적으면 위 항목의 사본이 되고, 배열을 고칠 때 사본만 낡는다.
# ⇒ 위 `profiles:` 목록에 넣으면 `_by_season_from` 이 계절마다 `weights` 를
#   **필수로** 요구하므로 (`entry["weights"]`) 넣을 수 없다. 자리를 가른 것이
#   그 사실을 그대로 적은 것이다.
#
# ## ⚠⚠ 위 `shape.load.household.daily` 의 `seasons[].share` 를 고친 것이 아니다
#
# 그것(봄 0.23 · 여름 0.28 · 가을 0.22 · 겨울 0.27)은 **일반 가전 부하**의
# 계절 몫이고 그대로 남아 있다. 냉난방은 **다른 계절 몫**을 가지며(겨울
# 0.5327 — 일반 부하의 두 배 가까이) **그것이 이 요구의 핵심이다.**
# 종전에는 냉난방 부하가 일반 부하와 **같은 몫**으로 강제로 갈렸다 —
# `core/casegrid/appliance_load.py` 머리말 ★★★ 절이 그 강제를 적는다.
#
# ## ⚠ 계절 **이름**은 위 두 항목과 반드시 같아야 한다
#
# 이름이 다르면 같은 몫이 다른 날에 걸린다. 읽는 쪽이 **거부한다**(`_matched`
# 가 자산의 달력과 이름으로 대조한다) — 짐작해 맞춰 주지 않는다.
# ⚠ **일수(`days:`)는 여기 적지 않는다** — 위 항목이 갖는 것을 그대로 쓰며,
# 여기 또 적으면 두 곳이 되고 한쪽만 고쳐진다.
#
# ## ⚠⚠⚠ 이 몫은 「가정」이며 실측이 아니다 — 무엇에서 나왔는가
#
# 아래 `derivation_method` 가 정본이다. 요지는 **다른 사업의 표준 모델 한
# 세대의 월별 값**(난방)과 **제주 1차 통계에서 재거나 환산한 값**(냉방·급탕)을
# 계절로 접은 것이며, 이 실증단지의 실측이 아니다.
# 값이 오면 **이 절만 고치면 된다** — 읽는 쪽은 한 줄도 고치지 않는다.
#
# ★ **2026-09-07(R66/WP-5)에 몫 넷이 갈렸다** — `0.1121/0.2019/0.1533/0.5327`
# → **`0.1293/0.2331/0.1662/0.4714`**. 급탕(연 501.6 kWh · 균등 41.8/월)이
# 항목으로 세워져 **열두 달에 깔렸고**, 겨울 몫이 그만큼 희석됐다. 근거가
# 「엑셀 하나」에서 **「엑셀 + 제주 1차 통계」**로 는 자리다.
# ═════════════════════════════════════════════════════════════════════════

appliance_season_shares:
  key: "share.load.appliance.seasonal"
  title: "냉난방(추가 기기) 부하의 계절별 몫"
  confidence: "가정"
  unit: "연간 냉난방 총량 중 몫 (합이 1)"
  derivation_method: >-
    가정 — ★ **근거가 「엑셀 하나」에서 「엑셀 + 제주 1차 통계」로 늘었다**
    (2026-09-07 · R66/WP-5. 조사는 R66/WP-3). 값은 그 조사로 **갈렸고**,
    형상(계절 순서와 크기)은 조사가 **뒷받침한다.**

    ## ⓐ 재료 — 월별 값 셋을 계절로 접는다

    난방은 「에너지 자립가구 경제성 분석 파일_260414B.xlsx」(사용자 제공
    2026-09-06 · 제주 특구 **4인 가구 한 세대의 표준 모델**)의
    `전력수요_산출!C4:C15` 를 **그대로 유지**했다(1월 500 · 2월 450 · 3월 300 ·
    11월 350 · 12월 475 · 나머지 0). 냉방은 **조사값 712.4 kWh/년**을 그 엑셀의
    **월 형상**(`D4:D15` 의 6:7:8:9 = 140:200:200:60)으로 배분해 6월 166.2 ·
    7월 237.5 · 8월 237.5 · 9월 71.2 다. 급탕은 **조사 환산 501.6 kWh/년**을
    **균등** 배분해 **열두 달 41.8** 이다. 접는 달력은 위 두 형상 항목과
    **같다**(3~5월 봄 · 6~8월 여름 · 9~11월 가을 · 12~2월 겨울).

    ⓑ **접은 결과** — 봄 **425.4**(3월 341.8 + 4월 41.8 + 5월 41.8) ·
    여름 **766.6**(208.0 + 279.3 + 279.3) · 가을 **546.6**(9월 113.0 +
    10월 41.8 + 11월 391.8) · 겨울 **1,550.4**(12월 516.8 + 1월 541.8 +
    2월 491.8) kWh, 합 **3,289.0** 이며 그 합은 대장 `load.heatpump.annual` 의
    값과 같은 수다.
    ⓒ **몫** — 위 넷을 3,289.0 으로 나눈 것이다: 425.4/3289 = 0.129340… →
    **0.1293** · 766.6/3289 = 0.233080… → **0.2331** · 546.6/3289 =
    0.166190… → **0.1662** · 1550.4/3289 = 0.471389… → **0.4714**.
    **네 자리로 끊은 뒤에도 합이 정확히 1.0000** 이므로 정규화하지 않았다
    (0.1293 + 0.2331 = 0.3624 → +0.1662 = 0.5286 → +0.4714 = **1.0000**.
    읽는 쪽은 합이 1 이 아니면 거부한다).

    ★★ **종전 0.1121/0.2019/0.1533/0.5327 에서 무엇이 바뀐 뜻인가** —
    **겨울이 0.5327 → 0.4714 로 떨어졌다.** 급탕이 **열두 달에 깔리면서**
    겨울 비중이 희석된 것이고, 그것이 사용자 문면
    *「간절기에는 냉난방부하 사실상 0에 수렴, **급탕 탱크만 히팅** 발생」*
    (`docs/decisions-2026-09-07-R66.md` §1ⓒ)이 말한 바다 — 종전에는 봄·가을에
    **곱할 값이 0** 이었다.

    ★ **조사가 뒷받침한 것은 「난방의 월별 형상」이다** — 에너지경제연구원
    14차 가구에너지패널조사(2023년 기준)의 **제주 월별** 연료 소비에서 유도한
    난방 월별 몫이 위 엑셀 몫과 **최대 3.5%p 안에서** 만나고 **순서가 같다**
    (1·12월 최대 → 2월 → 3·11월 → 나머지). ⇒ **크기는 갈리지만 형상은 두
    재료가 같은 말을 한다** — 그것이 이 조사의 가장 큰 소득이며, 이 절의 값이
    「엑셀 하나」에 기대지 않게 된 자리다.
    ⚠ **하나만 갈린다: 조사는 4·5·6·10월에 「꼬리」가 있다**(합 0.0635 ·
    난방 전력의 6.4%). 엑셀은 난방기간 11~3월을 **딱 끊었다.** 사용자 문면의
    *「사실상 0에 수렴」* 은 조사와도 맞는다 — 「사실상 0」이지 「0」은 아니다.
    ⛔ **그 꼬리를 넣지 않았다** — 난방 크기 자체를 엑셀로 유지했으므로 형상만
    조사로 갈면 두 재료가 한 칸에서 섞인다.
    ⚠ **냉방의 월 형상은 조사와 어긋난다**(조사는 8월 편중 · 9월 > 6월).
    총량만 조사값을 쓰고 **월 형상은 엑셀 것을 남긴** 사유는 조사가 낸 월별
    잔차 총량(300.1)이 같은 조사의 에어컨 원단위 총량(712.4)과 **2.4배** 갈려
    형상의 재료로 쓸 수 없었기 때문이다(에어컨의 **월별 사용시간** 자료를
    찾지 못했다). ⇒ **그 칸의 등급은 「환산」으로 남는다.**

    ⚠⚠ **이 몫이 냉난방만의 것이 아니라 전기차 충전에도 걸린다.** 러너의
    인자가 **합계 하나**(`extra_appliance_load_kwh`)여서 히트펌프와 전기차가
    같은 계절 몫을 탄다 — 전기차 주행거리의 계절 변동을 주는 자료를 찾지
    못했고, 기기별 계절 몫을 따로 받으면 화면 칸이 기기 수 × 계절 수로
    늘어난다. 대장 `load.ev.annual` 의 `impact_note` 가 같은 어긋남을 적는다.

    ⚠ **이 값은 실측이 아니다.** 난방 크기의 근거가 다른 사업의 표준 모델 한
    세대이고, 그 파일에 대해 사용자가 *「해당 자료도 참값은 아님. 가정한 값임을
    유의해줘」* 라고 명시했다. 계절의 **방향**(겨울이 가장 크고 봄이 가장
    작다)은 난방 부하의 성질과 맞고 이제 **제주 1차 통계도 그 방향을
    뒷받침한다.** ⚠ 그러나 **급탕의 균등 배분은 관측이 아니라 자료 결손에
    대한 최소가정**이다(월별 급수온도를 찾지 못했다) — 그 몫이 계절 넷에
    **똑같이 41.8 × 계절월수**로 깔려 있으므로, 급수온도 자료가 오면 네 몫이
    **함께** 움직인다.
  source: >-
    ⓐ **난방 월별** — 「에너지 자립가구 경제성 분석 파일_260414B.xlsx」의
    `전력수요_산출!C4:C15`(1월 500 · 2월 450 · 3월 300 · 11월 350 · 12월 475 ·
    나머지 0). 사용자 제공(2026-09-06).
    ⓑ **냉방 월 형상** — 같은 파일 `D4:D15`(6월 140 · 7월 200 · 8월 200 ·
    9월 60 · 나머지 0)의 **비율만** 썼고 **총량은 조사값 712.4** 다.
    ⚠ 그 파일은 `.gitignore:35 *.xlsx` 라 **저장소에 없고 다른 기계에도
    없다** — 그래도 어느 시트 어느 칸에서 왔는지를 적는다.
    ⓒ **냉방 총량 712.4 · 급탕 501.6 · 난방 월별 몫의 대조** — 에너지경제연구원
    「14차(2023년 기준) 가구에너지패널조사 결과표」의 **제주** 부분(1차)이
    재료다. 산식과 등급은 대장 `load.heatpump.annual` 의
    `derivation_method`·`source` 가 갖는다 — **여기서 다시 적지 않는다**
    (적으면 정본이 둘이 된다).
    ⛔ **계절별 냉난방 전력소비를 직접 싣는 실측은 여전히 찾지 못했다** —
    조사가 준 것은 **월별 연료 소비**이고 그것을 환산한 것이다.
  replace_when: >-
    실증 대상 가구의 **월별 또는 계절별 냉난방 전력소비 실측**이 올 때. 그때
    이 절의 `share` 넷만 갈아 끼우면 되고 읽는 쪽은 한 줄도 고치지 않는다.
    ★ **월별 급수온도**나 **에어컨의 월별 사용시간**이 확인될 때도 갈린다 —
    앞은 급탕의 균등 배분을, 뒤는 냉방의 월 형상을 푸는 자료다(대장 항목의
    `replace_when` ⓓ·ⓕ 와 같은 자리).
    ⚠ 8760 실측이 오면 계절로 접지 않고 그대로 바인딩한다(위 두 항목의
    `replace_when` 과 같은 판단 · 16.3 개인정보 절차 선행 · SC-3).
    ⚠ **바꾸면 골든 3종을 다시 뽑아야 한다** — 계절 몫은 연간 총량을 옮기지만
    운전(계통 송·수전)을 바꾸므로 결론축이 움직인다.
