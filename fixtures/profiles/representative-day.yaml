# 대표일 24스텝 **형상** — 가정이며 실측이 아니다.
#
# ## 이 파일이 정하는 것과 정하지 않는 것
#
#   정한다      하루 안에서 **어떻게 배분되는가** (정규화 가중치)
#   정하지 않는다 총량 — 부하는 대장 `load.household.annual`,
#                발전은 `pv_capacity_kw` × 이용률이 정한다
#
# 형상과 총량을 한 곳에 두면 총량을 고칠 때 형상이 따라 움직이거나 그 반대가
# 된다. 여기서는 **배분만** 적고, 읽는 쪽이 총량을 곱해 되돌린다.
#
# ## 왜 소스가 아니라 자산인가
#
# 24개 숫자를 파이썬 상수로 두면 그것은 **대장 밖의 값**이 되고, 이 저장소가
# `NFR-202` 로 막으려는 형태가 된다. 값이 아니라 형상이므로 대장 항목의 꼴
# (`value` + `sensitivity` 3수준)에도 맞지 않아, 출처·신뢰도를 함께 적을 수
# 있는 자산으로 둔다.
#
# ## 인덱스 관례 — **인덱스 0 이 00~01시다**
#
# `weights[i]` 는 **i~(i+1)시** 의 가중치이며, 붙임 7 시간대별 표의 i 번째
# 행과 같은 스텝이다(그 표의 첫 행이 「00~01시」다).
#
# ⚠ **이 관례를 적지 않아 두 스텝 어긋남이 눈에 띄지 않았다** (R37 후속).
# 발전 형상의 부기가 「일출 06시 · 일몰 19시」라고 적고 있었는데 실물 가중치는
# 인덱스 7~20 이었다. 관례가 없으면 부기와 배열을 맞춰 볼 방법이 없다 — 아래
# 각 형상의 `derivation_method` 는 **이 관례로 읽는다.**
#
# ## ⚠ **발전** 형상은 결론을 만든다 · **부하** 형상은 만들지 않는다
#
# R37 이 발전 형상을 `build_case_report` 의 본 실행과 민감도·용량 스윕에
# 배선했다 — 그러므로 이 파일의 발전 가중치는 **프로포마와 순현재가치의
# 입력**이다. 고치면 결론이 움직인다.
#
# 부하 형상은 다르다. 읽는 쪽(붙임 7 둘째 표)은 그것으로 **운전만** 다시
# 그리고 프로포마는 건드리지 않는다 — 부하를 편익 계산에 태우면 잉여판매가
# 줄어드는데 그 대가인 자가소비 절감은 **배타 규칙 유형 A** 라 같은 프로포마에
# 함께 실을 수 없다(`FR-402-AC2.A`). 한쪽만 반영하면 사업에 불리한 쪽으로
# 틀린다(양식 4절 · NSPM 대칭성).
#
# ## 계절 절 — **자리는 R56 이 세웠고 값은 R60/WP-4 가 가정으로 채웠다**
#
# 각 형상 항목은 `weights:` 대신 `seasons:` 를 가질 수 있다. 그 꼴은
# (아래 수는 **꼴을 보이는 예시**이며 값이 아니다 — 인용하지 마라):
#
#     seasons:
#       - name: "봄"
#         days: 92          # 그 계절의 일수. 합이 연간 일수와 같아야 한다
#         share: 0.26       # 연간 총량 중 이 계절의 몫. 합이 1 이어야 한다
#         weights: [ ... ]  # 그 계절 대표일의 상대 가중치
#
#   ⚠ **`seasons:` 와 `weights:` 를 둘 다 적지 마라** — 어느 쪽이 정본인지
#     말하지 않은 것이며 읽는 쪽이 거부한다.
#   ⚠ **`share` 는 형상 가중치와 달리 정규화되지 않는다.** 가중치는 *하루 안의
#     배분*이라 합이 자유롭고 읽는 쪽이 합으로 나누지만, `share` 는 *연간 총량의
#     분해*라 합이 1 이라는 뜻을 갖는다. 0.9 를 적으면 연간 에너지의 10%가
#     사라지므로 고쳐 주지 않고 거부한다.
#   ⚠ **부하와 발전이 같은 달력을 적어야 한다** — 계절 이름과 일수가 다르면
#     같은 인덱스가 서로 다른 날을 가리킨다. 읽는 쪽이 거부한다.
#   ★ **일수는 계절 수를 4로 못 박지 않는다** — 적은 개수를 그대로 쓴다.
#     월별(12)로 넓히는 것은 이 파일을 고치는 것만으로 된다.
#
# ★★★ **아래 두 항목의 `seasons:` 는 「가정」이며 실측이 아니다** (R60/WP-4).
#
# R56 은 *「실측이 없으니 값을 비운다」* 로 두었고, 사용자 판정
# (`docs/decisions-2026-09-04-R59b.md` §3 — *「일단 필요한 사항을 가정하여
# 설정하고, 추후 변경할 수 있게 설계해. 현재 정확한 값이 없음」*)이 그 방침을
# **바꿨다.** 그래서 지금 여기 있는 계절 일수·몫·형상은 전부 **가정값**이고,
# 두 항목의 `confidence: "가정"` 과 `derivation_method` 가 그 사실을 갖는다.
#
#   ⚠⚠⚠ **이 수를 실측으로 읽지 마라.** 리포트 붙임 8 의 「계절·요일 변동」이
#     매 실행 자산을 읽어 *「계절은 가정값으로 채웠다」* 를 함께 인쇄한다
#     (`core/report/unreflected.py::_season_reason`) — 그 문면이 사라지면
#     다음 사람이 가정값을 실측으로 읽는다.
#   ⚠ **교체는 이 파일 한 곳에서 끝난다.** 값이 오면 아래 `seasons:` 만 고치면
#     되고 읽는 쪽(`core/casegrid/profiles.py` · `e2e_runner.py`)은 한 줄도
#     고치지 않는다. 그래서 **계절 수·일수·몫을 코드에 리터럴로 박지 않는다.**
#   ⚠ **연간 총량은 여기 없다.** `share` 는 *연간 총량의 분해*이므로 합이 1 인
#     한 연간 사용량·발전량은 그대로이고 **계절 사이에서만 옮겨간다.** 총량은
#     계속 대장(`docs/assumptions.yaml`)과 설계 변수가 갖는다.
#
# ★ 계절을 **적지 않으면** 계절 하나(`연중` · 몫 1.0 · 일수는 읽는 쪽이 준
# `days` 전부)로 읽히고 그 출력은 계절 축이 서기 전과 **원소 하나까지 같다.**
# 각 항목의 `replace_when` 이 이 가정값을 무엇이 오면 **버릴 수 있는지**를 적는다.

