# 16.5 대조 테스트 케이스 표 (해석해 기반)
#
# 현행 엑셀 모형 미확보로 인해 §13.0.2 오라클 순위 1(해석해)을 사용하여
# 6종 지표에 대한 닫힌 형태의 정답을 구성함. 
# (주의: 해석해는 '산식이 맞다'만 보이고 '실무 전제와 맞다'는 보이지 않으므로, 
# §13.3 1차 대조군은 여전히 유예 상태임)

cases:
  - case_id: "analytical_case_1"
    description: "할인율 5%, 5년 사업, 초기비용 100만 원, 연간편익 30만 원"
    inputs:
      discount_rate: 0.05
      reinvestment_rate: 0.05
      years: 5
      initial_cost_won: 1000000
      annual_benefit_won: 300000
      loan_principal_won: 500000
      loan_interest_rate: 0.03
      loan_years: 5
    expected:
      # NPV: -1,000,000 + 300,000 * ((1 - 1.05^-5) / 0.05) = 298,843
      # 오라클 순위 1: 원 단위 완전 일치
      npv_won: 298843
      
      # IRR: 0 = -1,000,000 + 300,000 * ((1 - (1+r)^-5) / r) => 15.238%
      # 오라클 순위 2: 0.01% 허용오차 (반복해)
      irr_pct: 15.238
      
      # MIRR: PV(costs, 5%) = 1,000,000 / FV(benefits, 5%) = 300,000 * ((1.05^5 - 1) / 0.05) = 1,657,689
      # MIRR = (1,657,689 / 1,000,000)^(1/5) - 1 = 10.620%
      # 오라클 순위 2: 0.01% 허용오차
      mirr_pct: 10.620
      
      # B/C Ratio: PV(benefits) = 1,298,843 / PV(costs) = 1,000,000 => 1.298843
      # 오라클 순위 1: 분자(1,298,843) 분모(1,000,000) 원 단위 일치 
      bcr_numerator_won: 1298843
      bcr_denominator_won: 1000000
      bcr_ratio: 1.298843
      
      # 할인 회수기간:
      # Y1: 285,714 / Y2: 272,109 / Y3: 259,151 / Y4: 246,811
      # Y3 누적: 816,974 (잔여 183,026) -> 183,026 / 246,811 = 0.74156
      # 회수기간: 3.7416년
      # 오라클 순위 2: 0.01% 허용오차
      payback_discounted_years: 3.7416
      
      # 융자 상환 (원리금균등):
      # 500,000 * (0.03 * 1.03^5) / (1.03^5 - 1) = 109,177
      # 오라클 순위 1: 원 단위 일치
      loan_annual_payment_won: 109177
      loan_total_repayment_won: 545886
