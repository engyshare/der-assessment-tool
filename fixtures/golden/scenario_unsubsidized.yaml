# ── R66/WP-2 가 `npv_won` 셋을 다시 뽑았다 (사용자 판정 ③ — 「출력에 값을 붙인다」) ──
# **ESS 초기투자에 「원/kW 항」이 섰다.** R65 블록 끝의 ⚠⚠ 가 신고한 결손
# (*「20 kW 와 100 kW 의 초기투자가 같다」*)을 닫은 것이다. R66/WP-1 이 대장에
# `capex.ess.pcs_power`(**250,000원/kW** · 2023 국내 학술)와
# `capex.ess.pcs_share_of_system`(**20.0%** · 두 품목 단가로 설계점 환산)을 세우고,
# WP-2 가 그것을 계산에 배선했다.
#
# **식 (배포 구성 200 kWh · 100 kW)**
#   배터리 = `capex.ess.new` 500,000 × (1 − 20%) = **400,000원/kWh** × 200 = 80,000,000
#   PCS    = `capex.ess.pcs_power` **250,000원/kW** × 100 = **25,000,000**
#   ⇒ ESS 100,000,000 → **105,000,000원** · 총 초기투자 196,000,000 → **201,000,000원**
# ⚠ **몫으로 「떼기만」 하지 않았다.** `몫 × (단가 × 용량)` 으로 떼면 그 값이 다시
# 용량에 비례해 **출력은 여전히 공짜**다 — 대장 항목 `capex.ess.pcs_share_of_system`
# 이 그 함정을 스스로 적었다(*「그때는 몫이 아니라 `capex.ess.pcs_power` 를 곱해야
# 한다」*). 그래서 몫은 **배터리 단가를 줄이는 데만** 쓴다.
# ★ 이 형태에는 국내 학술 선례가 있다 — 이예빈 외, 「피크 저감용 ESS의 화재예방 설비를
# 고려한 경제성 평가에 관한 연구」, 2024 한국산학기술학회 춘계 학술발표논문집 식 (1):
# `C_ESS = (C_PCS · Q_PCS) + (C_bat · Q_bat) + α + β`.
#
# **이 시나리오(보조율 0)의 이동**: `npv_won` -323,257,263 → **-328,257,263** (**−5,000,000원**).
#
# **왜 세 폭이 다른가** — 움직인 것이 **초기투자 하나**이고 보조율이 그 분담만
# 바꾸기 때문이다(R65 블록이 같은 사실을 적었다). 무보조 −5,000,000 ·
# 보조 20% −4,000,000(= 0.80 × 5,000,000) · 보조 80% −1,000,000(= 0.20 × 5,000,000).
#
# **안 움직인 것 — 운영도, 교체비도, 잔존가치도다.** 대표일 태양광·부하, 계통 송·수전,
# 첨두 절감, 고정 O&M 둘, PV 교체비(13년차 18,262,682) · PV 잔존가치(20년차
# −25,287,561) · **ESS 교체비(18년차 140,024,142) · ESS 잔존가치(20년차 −115,313,999)**
# 가 **한 원도** 안 움직였다. 그래서 이동 폭이 초기투자 증가분과 **정확히 같다**
# (초기투자는 1년차이고 현가계수가 1.0 이다). 교체 단가가 몫 감산을 타지 않는 것은
# 그것이 **별 대장 항목**(`capex.ess.replacement`)에서 오기 때문이며,
# `payback_period_years` 는 셋 다 `.inf` 그대로다.
#
# ⚠⚠⚠ **+5,000,000원은 「두 출처의 층위가 어긋난 결과」이며 숨기지 않는다.**
# `capex.ess.new` 는 「PCS·설치 포함 시스템 단가」이고 `capex.ess.pcs_power` 는
