# Alembic configuration -- owned by WP-13 (spec 16.4).
#
# Why this lives in infra/migrations/, not at repo root:
#   1. COMMON.md section 1 does not assign root-level .ini ownership, and WP-15
#      owns pyproject.toml -- a root alembic.ini risks collision.
#   2. infra/migrations/ is explicitly WP-13 sole ownership (COMMON.md table).
#   3. Alembic accepts any path via `-c <ini path>`, so root is not required.
#
# sqlalchemy.url is not pinned here. The DB path is supplied via the DER_DB_URL
# environment variable or injected by tests via Config.set_main_option. Committing
# a local path here is an SC-3 risk (leaking local file paths).
#
# Usage:
#   alembic -c infra/migrations/alembic.ini upgrade head
#   DER_DB_URL=sqlite:///app.db alembic -c infra/migrations/alembic.ini upgrade head

[alembic]
# %(here)s is interpolated by Alembic to the directory containing this ini.
# Without it, script_location would be relative to the current working
# directory of whoever runs alembic, and tests/CLI would resolve differently.
script_location = %(here)s
sqlalchemy.url = sqlite:///der.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
